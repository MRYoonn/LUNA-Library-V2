name: SI isolated synthetic regression
on:
  push:
    branches:
      - agent/paper-si-finder-linker
    paths:
      - 'tools/si_*.py'
      - 'tests/test_si_*.py'
      - 'src/lunasiidentity.h'
      - 'tests/native_si_identity/**'
      - 'tools/preflight_public.py'
      - '.github/workflows/si-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public-source privacy gate
        run: python -B tools/preflight_public.py
      - name: Actual repository SI integration tests (offline, synthetic)
        # All finder network calls are injected synthetic fakes. An offline=1
        # environment would bypass those fakes and invalidate the assertions.
        # The suite has no live Figshare requests or PDF downloads.
        env:
          LUNA_SI_OFFLINE: '0'
        run: python -B -m unittest discover -s tests -p 'test_si_*.py' -v


  linux-qtcore-identity:
    # Exercise POSIX case-sensitive library-root boundaries with actual Qt6.
    # Synthetic PDF bytes only; no network lookup, secrets or private files.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Compile and run QtCore case-sensitive identity regression
        run: |
          cmake -S tests/native_si_identity -B "${RUNNER_TEMP}/luna-si-identity-linux" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/luna-si-identity-linux" --config Release
          ctest --test-dir "${RUNNER_TEMP}/luna-si-identity-linux" -C Release --output-on-failure

  windows-qtcore-identity:
    # Standalone native identity proof; no PDF4QT, UI, secrets or user files.
    # Do not confuse this with the production Windows LUNA application build.
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Compile and run isolated QtCore SI UUID tests
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'luna-si-identity-native'
          cmake -S tests/native_si_identity -B $build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'SI identity QtCore configure failed' }
          cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'SI identity QtCore compile failed' }
          ctest --test-dir $build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'SI identity QtCore regression failed' }
