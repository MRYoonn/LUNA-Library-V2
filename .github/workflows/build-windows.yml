name: LUNA Library V2 - Windows Portable

# Manual builds only. No private data, secrets, or untrusted PR execution.
on:
  workflow_dispatch:
    inputs:
      production_paper_capture:
        description: "Capture the verified f89c2a1 portable with the pinned public paper"
        type: boolean
        default: false
      ui_reference_capture:
        description: 'Capture approved v0.9.1 in Windows Edge alongside native UI evidence'
        type: boolean
        default: false
      p0_lifetime_debug:
        description: 'Diagnose unchanged b5 EXE and validate a private local crash capture kit; never a release'
        type: boolean
        default: false
      native_tabs_proof:
        description: 'Isolated native-session architecture proof; never release portable'
        type: boolean
        default: false
      tab_host_source_run:
        description: 'Experimental host only: successful full Beta Windows source run ID'
        type: string
        default: ''
      build_installer:
        description: 'Optional legacy installer investigation only; disabled for portable-first distribution'
        type: boolean
        default: false
      research_pdf_probe:
        description: 'Optional precise public research PDF glyph/selection check (not a core Beta gate)'
        type: boolean
        default: false
      native_probes_only:
        description: 'Run standalone native Qt probes without compiling the PDF engine'
        type: boolean
        default: false
      packaging_preflight_only:
        description: 'Validate Windows runtime staging without compiling PDF4QT'
        type: boolean
        default: false
      verify_print_portable:
        description: 'Check native Ctrl+P in the already validated reader portable build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luna-library-v2-windows-${{ inputs.ui_reference_capture && inputs.packaging_preflight_only && 'ui-reference' || inputs.p0_lifetime_debug && 'p0-lifetime' || inputs.native_probes_only && 'native-probes' || inputs.tab_host_source_run != '' && 'tab-host' || 'app' }}
  cancel-in-progress: false

jobs:
  production-paper-capture:
    if: inputs.production_paper_capture
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LUNA-Windows-Portable
          run-id: 41013214904
          github-token: ${{ github.token }}
          path: portable
      - name: Verify exact accepted EXE and capture ordinary public-paper launches
        shell: pwsh
        run: |
          $info = Get-Content portable/build-info.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash portable/LUNA.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($info.commit -ne 'f89c2a1b23aa7d4e469f00fcfd9cab8a5e119c15' -or $hash -ne 'a2da5bf18c2115c2c15a7013f426e2165226513830c553cdc83aec16ae8921bf') { throw 'Unverified portable source or executable' }
          python -B tools/prepare_desktop_windows.py captures/desktop.json
          if ($LASTEXITCODE -ne 0) { throw 'Native display mode failed' }
          python -B tools/probe_chrome_windows.py portable captures/ordinary --public-paper
          if ($LASTEXITCODE -ne 0) { throw 'Production public-paper launch failed' }
          Copy-Item portable/build-info.json captures/build-info.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: LUNA-Production-Paper-Screenshots
          path: captures/
          if-no-files-found: error

  ui-reference:
    if: inputs.ui_reference_capture
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public reference identity and capture Windows Edge
        shell: pwsh
        run: |
          python -B tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw 'Public source check failed' }
          node tools/capture_ui_reference_windows.mjs design/LUNA_Library_UI_v0.9.1_OneLineMemo.html html-reference
          if ($LASTEXITCODE -ne 0) { throw 'Windows HTML reference capture failed' }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: LUNA-HTML-v091-Windows-Reference
          path: html-reference/
          if-no-files-found: error

  p0-lifetime-debug:
    if: inputs.p0_lifetime_debug
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/p0-editor-lifetime.yml

  windows-packaging-preflight:
    if: ${{ !inputs.p0_lifetime_debug }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Bootstrap trace before checkout (synthetic metadata only)
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP 'luna-build-diagnostics'
          New-Item -ItemType Directory -Path $trace -Force | Out-Null
          @{ schema = 1; status = 'started'; source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; job = $env:GITHUB_JOB } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $trace 'bootstrap.json')
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Initialize permanent synthetic build trace
        shell: pwsh
        run: |
          python -B tools/build_diagnostics.py start --output "$env:RUNNER_TEMP/luna-build-diagnostics"
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize build diagnostics' }

      - name: Public source gate and regression tests
        id: public-gate
        shell: pwsh
        run: |
          python -B tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw "Public security gate blocked build" }
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }
          python -B tools/verify_folder_counts.py --output "$env:RUNNER_TEMP/luna-build-diagnostics/folder-count-verification.json"
          if ($LASTEXITCODE -ne 0) { throw "Folder-count semantic gate failed; inspect diagnostics artifact" }
          python -B tests/native_dialog/windows_job.py
          if ($LASTEXITCODE -ne 0) { throw "Synthetic Windows process containment failed" }
      - name: Validate official x64 CRT staging on the actual Windows image
        id: crt-check
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'luna-crt-preflight'
          & ./tools/stage_msvc_runtime.ps1 -Destination $output
          python -B -c "import sys; from pathlib import Path; from tools.verify_portable import is_x64_pe; files=list(Path(sys.argv[1]).glob('*.dll')); assert files and all(is_x64_pe(p) for p in files), 'Invalid x64 CRT files'; print('[PASS] App-local CRT files are Windows x64 PE binaries')" $output
          if ($LASTEXITCODE -ne 0) { throw "CRT binary validation failed" }
      - name: Download validated reader portable for native print verification
        if: inputs.verify_print_portable
        uses: actions/download-artifact@v4
        with:
          name: LUNA-Windows-Portable
          run-id: 40282150131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/luna-verified-reader
      - name: Verify native Windows Ctrl+P and Cancel in the validated portable EXE
        if: inputs.verify_print_portable
        shell: pwsh
        run: |
          & ./tools/probe_print_windows.ps1 -Package "$env:RUNNER_TEMP/luna-verified-reader"

      - name: Finalize public preflight diagnostic record
        if: always()
        shell: pwsh
        run: |
          if (Test-Path tools/build_diagnostics.py) {
            python -B tools/build_diagnostics.py finish --output "$env:RUNNER_TEMP/luna-build-diagnostics" --status "${{ job.status }}" --gates "checkout=${{ steps.checkout.outcome }};public-gate=${{ steps.public-gate.outcome }};crt-check=${{ steps.crt-check.outcome }}"
            if ($LASTEXITCODE -ne 0) { throw 'Could not finalize preflight diagnostics' }
          } else {
            $trace = Join-Path $env:RUNNER_TEMP 'luna-build-diagnostics'
            New-Item -ItemType Directory -Force -Path $trace | Out-Null
            @(
              '# LUNA Build Error Analysis',
              "- Run: $env:GITHUB_RUN_ID",
              "- Source SHA: $env:GITHUB_SHA",
              '- Cause not established: checkout/source diagnostics unavailable.',
              "- Job logs: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ) | Set-Content -Encoding utf8 (Join-Path $trace 'failure-analysis.md')
            Write-Warning 'Source checkout missing; bootstrap and minimal analysis preserved.'
          }
      - name: Preserve failed preflight analysis in a GitHub issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $analysis = Join-Path $env:RUNNER_TEMP 'luna-build-diagnostics/failure-analysis.md'
          if (Test-Path $analysis) {
            gh issue create --title "LUNA Preflight #$env:GITHUB_RUN_NUMBER - failure analysis" --body-file $analysis
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Issue archival failed; preflight artifact retained' }
          }
      - name: Upload public preflight diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Preflight-Diagnostics
          path: ${{ runner.temp }}/luna-build-diagnostics/
          if-no-files-found: warn
          retention-days: 90

  native-probes:
    needs: windows-packaging-preflight
    if: inputs.native_probes_only
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Compile and run native Qt probes
        shell: pwsh
        run: |
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $probe = Join-Path $env:RUNNER_TEMP 'luna-native-probes'
          cmake -S tests/native_dialog -B $probe -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Native probe configuration failed" }
          cmake --build $probe --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native probe compilation failed" }
          ctest --test-dir $probe -C Release --verbose
          if ($LASTEXITCODE -ne 0) { throw "Native Qt probes failed" }

      - name: Compile isolated tab host without claiming POC execution
        shell: pwsh
        run: |
          $hostBuild = Join-Path $env:RUNNER_TEMP 'luna-tab-host-build'
          cmake -S experiments/tab_host -B $hostBuild -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Experimental host configuration failed" }
          cmake --build $hostBuild --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Experimental host compile failed" }
          Write-Host '[NOTICE] Host compilation only; no PDF embedding or POC acceptance is implied.'

  build-windows:
    needs: windows-packaging-preflight
    permissions:
      contents: read
      actions: read
      issues: write
    if: ${{ !inputs.production_paper_capture && !inputs.packaging_preflight_only && !inputs.native_probes_only && !inputs.tab_host_source_run }}
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PDF4QT_PIN: 67b6b9903cb4e318803342f2d428f02e1bb124e3
      # Same public vcpkg revision used by the preserved successful Build 20.
      VCPKG_PIN: 817892b0ecbc6af994dd6df999c73faf795adbf2
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\pdf4qt\vcpkg\overlays\general
    steps:
      - name: Bootstrap trace before checkout (synthetic metadata only)
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP 'luna-build-diagnostics'
          New-Item -ItemType Directory -Path $trace -Force | Out-Null
          @{ schema = 1; status = 'started'; source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; job = $env:GITHUB_JOB } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $trace 'bootstrap.json')
      - name: Checkout public builder with no retained credentials
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize permanent synthetic build trace
        shell: pwsh
        run: |
          python -B tools/build_diagnostics.py start --output "$env:RUNNER_TEMP/luna-build-diagnostics"
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize build diagnostics' }

      - name: Fail-closed public security checks
        id: source-check
        shell: pwsh
        run: |
          python tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw "Public security gate blocked build" }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }

      - name: Download and verify pinned public PDF4QT
        shell: pwsh
        run: |
          git init pdf4qt
          git -C pdf4qt remote add origin https://github.com/JakubMelka/PDF4QT.git
          git -C pdf4qt fetch --depth 1 origin $env:PDF4QT_PIN
          if ($LASTEXITCODE -ne 0) { throw "Upstream checkout failed" }
          git -C pdf4qt checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Upstream checkout failed" }
          $actual = (git -C pdf4qt rev-parse HEAD).Trim()
          if ($actual -ne $env:PDF4QT_PIN) { throw "Upstream SHA mismatch" }

      - name: Stabilize pinned engine source timestamps for incremental compilation
        shell: pwsh
        run: |
          # Only immutable upstream files; overlay sources are written afterward
          # with fresh timestamps and are rebuilt on every application change.
          $env:LUNA_ENGINE_TIMESTAMP = (git -C pdf4qt show -s --format=%ct HEAD).Trim()
          python -B -c "import os; from pathlib import Path; stamp=int(os.environ['LUNA_ENGINE_TIMESTAMP']); root=Path('pdf4qt'); files=[p for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts]; [os.utime(p,(stamp,stamp)) for p in files]"
          if ($LASTEXITCODE -ne 0) { throw 'Engine source timestamp normalization failed' }

      - name: Apply isolated LUNA target
        shell: pwsh
        run: |
          python tools/apply_overlay.py pdf4qt --dry-run
          if ($LASTEXITCODE -ne 0) { throw "Source pin mismatch" }
          python tools/patch_script_text_layout.py pdf4qt --dry-run
          if ($LASTEXITCODE -ne 0) { throw "Pinned text layout mismatch" }
          python tools/patch_thin_vector_strokes.py pdf4qt --dry-run
          if ($LASTEXITCODE -ne 0) { throw "Pinned PDF vector renderer mismatch" }
          python tools/apply_overlay.py pdf4qt
          if ($LASTEXITCODE -ne 0) { throw "LUNA patch failed" }
          python tools/patch_script_text_layout.py pdf4qt
          if ($LASTEXITCODE -ne 0) { throw "LUNA superscript/subscript selection patch failed" }
          python tools/patch_thin_vector_strokes.py pdf4qt
          if ($LASTEXITCODE -ne 0) { throw "LUNA thin-vector-stroke screen patch failed" }

      - name: Apply opt-in native session proof
        shell: pwsh
        run: |
          $proofArguments = @()
          if ('${{ inputs.native_tabs_proof }}' -ne 'true') { $proofArguments += '--backend-only' }
          python -B experiments/native_tabs/prepare.py pdf4qt @proofArguments
          if ($LASTEXITCODE -ne 0) { throw "Native session source gate failed" }
          python -B tools/apply_performance.py pdf4qt
          if ($LASTEXITCODE -ne 0) { throw "Performance instrumentation failed" }

      - name: Identify the Windows compiler image for dependency caching
        id: compiler-image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = (Get-Content (Join-Path $installation 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          if (-not $toolset) { throw 'Could not identify MSVC version' }
          "identity=$($env:ImageVersion)-$toolset" >> $env:GITHUB_OUTPUT

      # Public dependency cache only; contains no user documents or authentication data.
      - name: Cache public vcpkg archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg-binary-cache
            vcpkg/downloads
            vcpkg/vcpkg.exe
          key: ${{ runner.os }}-pdf4qt-vcpkg-${{ env.VCPKG_PIN }}-${{ steps.compiler-image.outputs.identity }}-tool-2026-09-26-sha256-${{ hashFiles('pdf4qt/vcpkg.json', 'pdf4qt/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-pdf4qt-vcpkg-${{ env.VCPKG_PIN }}-${{ steps.compiler-image.outputs.identity }}-
            ${{ runner.os }}-pdf4qt-vcpkg-${{ hashFiles('pdf4qt/vcpkg.json', 'pdf4qt/vcpkg-configuration.json') }}

      # LUNA first-use beta excludes OCR. Skip unnecessary Windows packages.
      # This changes only the ephemeral public PDF4QT checkout, never the pinned source.
      - name: Exclude optional OCR and Linux-only TBB from Windows dependencies
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'pdf4qt/vcpkg.json'
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.dependencies = @($manifest.dependencies | Where-Object { $_ -notin @('tesseract', 'tbb') })
          $manifest | ConvertTo-Json -Depth 15 | Set-Content -Encoding utf8 $manifestPath
          Write-Host "Release-only dependencies:" ($manifest.dependencies -join ', ')

      - name: Prepare vcpkg packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # Cache restore may already have created vcpkg/downloads. Preserve it.
          git init vcpkg
          if ($LASTEXITCODE -ne 0) { throw "vcpkg init failed" }
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE -ne 0) { throw "vcpkg remote setup failed" }
          git -C vcpkg fetch --depth 1 origin $env:VCPKG_PIN
          if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch failed" }
          git -C vcpkg checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed" }
          if ((git -C vcpkg rev-parse HEAD).Trim() -ne $env:VCPKG_PIN) { throw "vcpkg revision mismatch" }
          $baseline = (Get-Content -Raw pdf4qt/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C vcpkg fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "vcpkg baseline missing" }
          # The upstream vcpkg-tool asset is immutable. Verify its official
          # release SHA-256 even if restored from the Actions dependency cache.
          # GitHub release URLs have repeatedly returned HTTP 504 on Windows.
          # Use the official GitHub release-ASSET API endpoint as an independent
          # path before trying the stock bootstrap download. Reject JSON/error
          # responses and any wrong binary: no unpinned executable is allowed.
          $toolPath = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $expectedToolSha = '2a4ae1467b9e797964c60c919d057b9e5dc1ec03f4b9632c1150026db25201f2'
          $verifiedTool = $false
          if (Test-Path $toolPath) {
            $verifiedTool = (Get-FileHash -Path $toolPath -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedToolSha
            if (-not $verifiedTool) {
              Remove-Item -LiteralPath $toolPath -Force
              Write-Warning 'Cached vcpkg-tool hash mismatch; removed untrusted executable'
            }
          }
          if (-not $verifiedTool) {
            $partial = "$toolPath.api-part"
            try {
              $headers = @{
                'Accept' = 'application/octet-stream'
                'User-Agent' = 'LUNA-Pinned-Windows-CI'
                'X-GitHub-Api-Version' = '2022-11-28'
                'Authorization' = "Bearer $env:GH_TOKEN"
              }
              Invoke-WebRequest -Uri 'https://api.github.com/repos/microsoft/vcpkg-tool/releases/assets/589884028' -Headers $headers -OutFile $partial -MaximumRedirection 8 -TimeoutSec 90
              if ((Test-Path $partial) -and
                  ((Get-FileHash -Path $partial -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedToolSha)) {
                Move-Item -LiteralPath $partial -Destination $toolPath -Force
                $verifiedTool = $true
                Write-Host 'Recovered immutable vcpkg-tool from official GitHub release asset API with verified SHA-256.'
              } else {
                Write-Warning 'GitHub release asset API did not supply the pinned executable; falling back to stock bootstrap'
              }
            } catch {
              Write-Warning 'Official GitHub release asset API unavailable; falling back to pinned stock bootstrap'
            } finally {
              if (Test-Path $partial) { Remove-Item -LiteralPath $partial -Force }
            }
          }
          if (-not $verifiedTool) {
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
              if ($LASTEXITCODE -eq 0 -and (Test-Path $toolPath)) {
                $verifiedTool = (Get-FileHash -Path $toolPath -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedToolSha
                if (-not $verifiedTool) { throw 'Stock vcpkg bootstrap produced an unexpected SHA-256; refusing to execute' }
                break
              }
              if ($attempt -lt 5) {
                $backoff = 8 * $attempt
                Write-Warning "Pinned vcpkg bootstrap attempt $attempt failed; retrying in $backoff seconds."
                Start-Sleep -Seconds $backoff
              }
            }
          }
          if (-not $verifiedTool) { throw 'Pinned vcpkg-tool unavailable via both official release asset API and stock bootstrap' }
          New-Item -Path (Join-Path $env:VCPKG_ROOT 'vcpkg.disable-metrics') -ItemType File -Force | Out-Null
          # The pinned vcpkg registry needs CMake 4.4.3, and its standard
          # github.com/Kitware release URL returns HTTP 503 on this runner.
          # Pre-seed the regular vcpkg downloads cache using the official
          # GitHub asset API. Verify the immutable upstream SHA-256 first;
          # vcpkg will independently verify its own source-defined hash.
          $cmakeZip = Join-Path $env:VCPKG_ROOT 'downloads/cmake-4.4.3-windows-x86_64.zip'
          $expectedCmakeSha = '4d52ebab7193a698651639ed80d8d04fd903358843572cf44c7fd234cb7c26ab'
          New-Item -Path (Split-Path -Parent $cmakeZip) -ItemType Directory -Force | Out-Null
          $cmakeVerified = (Test-Path $cmakeZip) -and
            ((Get-FileHash -Path $cmakeZip -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedCmakeSha)
          if ((Test-Path $cmakeZip) -and -not $cmakeVerified) {
            Remove-Item -LiteralPath $cmakeZip -Force
            Write-Warning 'Deleted CMake cached archive with incorrect checksum'
          }
          if (-not $cmakeVerified) {
            $candidateZip = "$cmakeZip.api-part"
            for ($try = 1; $try -le 3 -and -not $cmakeVerified; $try++) {
              try {
                $cmakeHeaders = @{
                  'Accept' = 'application/octet-stream'
                  'User-Agent' = 'LUNA-Pinned-Windows-CI'
                  'X-GitHub-Api-Version' = '2022-11-28'
                  'Authorization' = "Bearer $env:GH_TOKEN"
                }
                Invoke-WebRequest -Uri 'https://api.github.com/repos/Kitware/CMake/releases/assets/529578311' -Headers $cmakeHeaders -OutFile $candidateZip -MaximumRedirection 8 -TimeoutSec 120
                if ((Test-Path $candidateZip) -and
                    ((Get-FileHash -Path $candidateZip -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedCmakeSha)) {
                  Move-Item -LiteralPath $candidateZip -Destination $cmakeZip -Force
                  $cmakeVerified = $true
                  Write-Host 'Verified CMake 4.4.3 archive from official GitHub release asset API.'
                } else {
                  Write-Warning 'CMake release API response did not match pinned SHA-256'
                }
              } catch {
                Write-Warning "Pinned CMake release asset attempt $try failed"
              } finally {
                if (Test-Path $candidateZip) { Remove-Item -LiteralPath $candidateZip -Force }
              }
              if (-not $cmakeVerified -and $try -lt 3) { Start-Sleep -Seconds (5 * $try) }
            }
          }
          if (-not $cmakeVerified) { throw 'Pinned CMake 4.4.3 archive unavailable; refusing unverified dependency' }
          # vcpkg compiler detection also fetches Ninja 1.13.2 via the
          # unreliable github.com release endpoint (HTTP 503/504 in CI).
          # Seed its normal archive name from the immutable upstream asset
          # API, refuse incorrect bytes, and let vcpkg verify the package.
          $ninjaZip = Join-Path $env:VCPKG_ROOT 'downloads/ninja-win-1.13.2.zip'
          $expectedNinjaSha = '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'
          $ninjaVerified = (Test-Path $ninjaZip) -and
            ((Get-FileHash -Path $ninjaZip -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedNinjaSha)
          if ((Test-Path $ninjaZip) -and -not $ninjaVerified) {
            Remove-Item -LiteralPath $ninjaZip -Force
            Write-Warning 'Deleted Ninja cache archive with incorrect SHA-256'
          }
          if (-not $ninjaVerified) {
            $ninjaCandidate = "$ninjaZip.api-part"
            for ($try = 1; $try -le 3 -and -not $ninjaVerified; $try++) {
              try {
                $ninjaHeaders = @{
                  'Accept' = 'application/octet-stream'
                  'User-Agent' = 'LUNA-Pinned-Windows-CI'
                  'X-GitHub-Api-Version' = '2022-11-28'
                  'Authorization' = "Bearer $env:GH_TOKEN"
                }
                Invoke-WebRequest -Uri 'https://api.github.com/repos/ninja-build/ninja/releases/assets/318863577' -Headers $ninjaHeaders -OutFile $ninjaCandidate -MaximumRedirection 8 -TimeoutSec 90
                if ((Test-Path $ninjaCandidate) -and
                    ((Get-FileHash -Path $ninjaCandidate -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedNinjaSha)) {
                  Move-Item -LiteralPath $ninjaCandidate -Destination $ninjaZip -Force
                  $ninjaVerified = $true
                  Write-Host 'Verified Ninja 1.13.2 from official GitHub release asset API.'
                } else {
                  Write-Warning 'Ninja release API response did not match pinned SHA-256'
                }
              } catch {
                Write-Warning "Pinned Ninja release asset attempt $try failed"
              } finally {
                if (Test-Path $ninjaCandidate) { Remove-Item -LiteralPath $ninjaCandidate -Force }
              }
              if (-not $ninjaVerified -and $try -lt 3) { Start-Sleep -Seconds (5 * $try) }
            }
          }
          if (-not $ninjaVerified) { throw 'Pinned Ninja 1.13.2 archive unavailable; refusing unverified dependency' }
          # GitHub's /archive/<sha>.tar.gz endpoint can fail with HTTP 504,
          # even after verified vcpkg, CMake and Ninja are in place. Its
          # direct official codeload equivalent avoids the failing gateway.
          # The hash below comes from PDF4QT's pinned blend2d overlay
          # portfile.cmake; do not use a different source revision.
          $blendZip = Join-Path $env:VCPKG_ROOT 'downloads/blend2d-blend2d-6dbc2cefbc996379e07104e34519a440b49b15d7.tar.gz'
          $blendSha512 = '05c8ff3fd99b22a5a157f18cc57e393c191235a09dc4e8d0d95c7314a665ea8668da0c077c727a77a26879fcbc6ae80cc49df0b93a184cdf7bf90ec55a247c68'
          $blendVerified = (Test-Path $blendZip) -and
            ((Get-FileHash -Path $blendZip -Algorithm SHA512).Hash.ToLowerInvariant() -eq $blendSha512)
          if ((Test-Path $blendZip) -and -not $blendVerified) {
            Remove-Item -LiteralPath $blendZip -Force
            Write-Warning 'Deleted unverified Blend2D cache archive'
          }
          if (-not $blendVerified) {
            $blendPart = "$blendZip.api-part"
            for ($try = 1; $try -le 3 -and -not $blendVerified; $try++) {
              try {
                Invoke-WebRequest -Uri 'https://codeload.github.com/blend2d/blend2d/tar.gz/6dbc2cefbc996379e07104e34519a440b49b15d7' -OutFile $blendPart -TimeoutSec 90
                if ((Test-Path $blendPart) -and
                    ((Get-FileHash -Path $blendPart -Algorithm SHA512).Hash.ToLowerInvariant() -eq $blendSha512)) {
                  Move-Item -LiteralPath $blendPart -Destination $blendZip -Force
                  $blendVerified = $true
                  Write-Host 'Verified Blend2D pinned source archive from GitHub codeload with overlay SHA-512.'
                } else {
                  Write-Warning 'Blend2D archive checksum did not match pinned overlay; refusing source.'
                }
              } catch {
                Write-Warning "Blend2D source archive attempt $try failed."
              } finally {
                if (Test-Path $blendPart) { Remove-Item -LiteralPath $blendPart -Force }
              }
              if (-not $blendVerified -and $try -lt 3) { Start-Sleep -Seconds (5 * $try) }
            }
          }
          if (-not $blendVerified) { throw 'Pinned Blend2D archive unavailable; refusing unverified source' }
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE\pdf4qt" --x-install-root="$env:VCPKG_INSTALLED_DIR" --clean-buildtrees-after-build --clean-packages-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependencies failed" }

      # Preserve successfully built public dependencies even if a later native
      # regression fails. The app, user files and settings are never cached.
      - name: Save validated public dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg-binary-cache
            vcpkg/downloads
            vcpkg/vcpkg.exe
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      # install-qt may select a newer Python than our UIA/Pillow wheels support.
      - name: Select verified Python for native capture and packaging tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test LUNA metadata Qt native contracts (no network)
        id: metadata-test
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'luna-metadata-build'
          cmake -S tests/native_metadata -B $probe -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Metadata Qt test CMake configuration failed" }
          cmake --build $probe --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Metadata Qt native compilation failed" }
          # Native Qt fatal assertions on Windows can exit 0xC0000409;
          # send Qt diagnostics to stderr and print the exact named failing
          # assertion/checkpoint rather than suppressing the test output.
          $env:QT_FORCE_STDERR_LOGGING = '1'
          ctest --test-dir $probe -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) {
            $report = Join-Path $probe 'Testing/Temporary/LastTest.log'
            if (Test-Path $report) { Get-Content $report -Tail 120 }
            throw "Metadata Qt native contract test failed; inspect LUNA_METADATA_TEST_FAILED above"
          }

      - name: Test native Save As dialog before compiling the PDF engine
        id: dialog-test
        shell: pwsh
        run: |
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $probe = Join-Path $env:RUNNER_TEMP 'luna-dialog-build'
          cmake -S tests/native_dialog -B $probe -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Native dialog probe configuration failed" }
          cmake --build $probe --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native dialog probe compile failed" }
          ctest --test-dir $probe -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native dialog probe failed; PDF engine build not started" }

      - name: Restore public engine compilation cache
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: pdf4qt/build
          key: ${{ runner.os }}-luna-native-sessions-release-noocr-v2-${{ env.PDF4QT_PIN }}-${{ env.VCPKG_PIN }}-qt6.11.3-${{ steps.compiler-image.outputs.identity }}

      - name: Configure native Windows build
        shell: pwsh
        run: |
          cmake -S pdf4qt -B pdf4qt/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DPDF4QT_QT_ROOT="$env:QT_ROOT_DIR" -DPDF4QT_BUILD_TESTS=OFF -DPDF4QT_ENABLE_OCR=OFF -DPDF4QT_INSTALL_DEPENDENCIES=ON -DPDF4QT_INSTALL_QT_DEPENDENCIES=ON -DPDF4QT_INSTALL_MSVC_REDISTRIBUTABLE=ON -DPDF4QT_INSTALL_PREPARE_WIX_INSTALLER=OFF -DPDF4QT_INSTALL_TO_USR=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

      - name: Compile source and install DLLs
        id: native-compile
        shell: pwsh
        run: |
          cmake --build pdf4qt/build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native compile failed" }
          cmake --install pdf4qt/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Native install failed" }

      # Cache before any PDF is opened: public compiler outputs only. Every
      # restored build still configures, compiles and runs the complete gates.
      - name: Save public engine compilation cache
        if: ${{ !inputs.native_tabs_proof && steps.engine-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: pdf4qt/build
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

      - name: Create standalone portable LUNA
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'pdf4qt/build/install/usr/bin'
          if (!(Test-Path "$bin/LUNA.exe")) { throw "LUNA.exe absent" }
          $output = Join-Path $env:GITHUB_WORKSPACE 'LUNA-Windows-Portable'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item -Path "$bin/*" -Destination $output -Recurse -Force
          # Standalone LUNA uses embedded moon resources, not the upstream
          # Windows Store tiles. Remove these obsolete branding assets only.
          if (Test-Path "$output/assets") { Remove-Item -LiteralPath "$output/assets" -Recurse -Force }
          if (Test-Path "$output/AppxManifest.xml") { Remove-Item -LiteralPath "$output/AppxManifest.xml" -Force }
          Get-ChildItem -LiteralPath $output -Filter '*.exe' -File | Where-Object { $_.Name -ne 'LUNA.exe' } | Remove-Item
          Copy-Item 'pdf4qt/LICENSE' "$output/PDF4QT_LICENSE.txt"
          Copy-Item 'pdf4qt/3rdparty_licenses' "$output/third_party_licenses" -Recurse
          Copy-Item 'LICENSE_NOTICE.md' "$output/LUNA_LICENSE_NOTICE.md"
          Copy-Item 'USER_GUIDE_KO.md' "$output/USER_GUIDE_KO.md"
          Copy-Item 'tools/LUNA-Update.ps1' "$output/LUNA-Update.ps1"
          $updateTokens = $null; $updateErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $output 'LUNA-Update.ps1'), [ref]$updateTokens, [ref]$updateErrors) | Out-Null
          if ($updateErrors.Count) { throw 'Updater PowerShell syntax failed' }
          Copy-Item 'tools/Start-Luna-Diagnostics.*' $output
          Copy-Item 'tools/*Crash*.ps1','tools/*Crash*.cmd','CRASH_DIAGNOSTICS_KO.md' $output
          $diagnosticTokens = $null; $diagnosticErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $output 'Start-Luna-Diagnostics.ps1'), [ref]$diagnosticTokens, [ref]$diagnosticErrors) | Out-Null
          if ($diagnosticErrors.Count) { throw 'Diagnostic launcher PowerShell syntax failed' }
          @{ product = 'LUNA Library'; status = 'development verification'; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; qt = '6.11.3'; pdf4qt = $env:PDF4QT_PIN; vcpkg = $env:VCPKG_PIN; validation = 'pending' } | ConvertTo-Json | Set-Content -Encoding utf8 "$output/build-info.json"
          # App-local redistributable DLLs make this portable on a clean PC.
          # windeployqt's release --compiler-runtime bundles a separate installer,
          # and cannot locate Visual Studio at all without VCINSTALLDIR.
          & ./tools/stage_msvc_runtime.ps1 -Destination $output
          $windeployqt = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          if (!(Test-Path $windeployqt)) { throw "Qt deploy tool absent" }
          & $windeployqt --release --no-compiler-runtime "$output/LUNA.exe"
          if ($LASTEXITCODE -ne 0) { throw "Qt DLL deployment failed" }
          if (!(Test-Path "$output/Qt6Core.dll")) { throw "Qt DLL missing" }
          $private = @(Get-ChildItem -Path $output -File -Recurse | Where-Object { $_.Extension -in @('.pdf','.db','.sqlite','.sqlite3','.env','.log','.pem','.pfx') })
          if ($private.Count -gt 0) { throw "Sensitive artifact blocked" }
          # Inspect compiled EXE: 1 blue app + 2 red PDF. A new standalone
          # .ico would be rejected by the already published v256 updater.
          python -B tools/probe_pdf_icon_windows.py "$output/LUNA.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Compiled LUNA icon resource validation failed' }
          Get-FileHash "$output/LUNA.exe" -Algorithm SHA256 | Format-List

      - name: Execute native two-document session acceptance
        if: ${{ inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem pdf4qt/build -Recurse -Filter LunaNativeTabs.exe -File)
          if ($exe.Count -ne 1) { throw 'Expected one native proof executable' }
          $proof = Join-Path $env:RUNNER_TEMP 'luna-native-proof-package'
          Copy-Item LUNA-Windows-Portable $proof -Recurse
          Copy-Item $exe[0].FullName (Join-Path $proof 'LunaNativeTabs.exe')
          python -B experiments/native_tabs/run_windows.py "$proof/LunaNativeTabs.exe" "$env:RUNNER_TEMP/luna-native-tabs-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime acceptance failed; compilation is not success' }

      - name: Upload native session evidence even on failure
        if: ${{ always() && inputs.native_tabs_proof }}
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-native-tabs-evidence
          path: ${{ runner.temp }}/luna-native-tabs-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify portable package layout
        id: portable-check
        shell: pwsh
        run: |
          python -B tools/verify_portable.py LUNA-Windows-Portable
          if ($LASTEXITCODE -ne 0) { throw "Portable package verification failed" }

      - name: Verify immutable released v261 baseline for same-machine comparison
        id: benchmark-baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'luna-v261-release-baseline'
          $baseline = Join-Path $env:RUNNER_TEMP 'luna-performance-before'
          $evidence = Join-Path $env:RUNNER_TEMP 'luna-ui/performance'
          New-Item -ItemType Directory -Force $download, $evidence | Out-Null
          gh release download v0.9.0.261 --repo $env:GITHUB_REPOSITORY --pattern LUNA-Windows-Portable.zip --pattern LUNA-Release.json --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Pinned v261 baseline release download failed' }
          @'
          import hashlib,json,pathlib,sys,zipfile
          source,destination,evidence=map(pathlib.Path,sys.argv[1:])
          archive=source/'LUNA-Windows-Portable.zip'
          manifest=source/'LUNA-Release.json'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='72cbcbb58d326eb24a222f3b91429c4018e4693284785d1961fee1a7af07718c'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='617a707613feafe1dcb7dcf1c1a58ffc4a55cb4e0ff86ba3d13af94f2b036379'
          m=json.loads(manifest.read_text())
          assert m['tag']=='v0.9.0.261' and m['commit']=='c40470847d3f22fbb7c993d2c91dfae6b6b50c4c'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None and len(z.namelist())==len(set(z.namelist()))
              assert set(z.namelist())=={f['path'] for f in m['files']}
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts and '\\' not in n and ':' not in n for n in z.namelist())
              assert all(len(z.read(f['path']))==f['size'] and hashlib.sha256(z.read(f['path'])).hexdigest()==f['sha256'] for f in m['files'])
              info=json.loads(z.read('build-info.json'))
              assert info['commit']==m['commit'] and info['validation']['windowsCpp']=='passed'
              assert hashlib.sha256(z.read('LUNA.exe')).hexdigest()==info['exeSha256']
              z.extractall(destination)
          (evidence/'baseline-provenance.json').write_text(json.dumps(dict(tag=m['tag'],commit=m['commit'],source_run=m['source_run'],zip_sha256=m['sha256'],exe_sha256=info['exeSha256']),indent=2))
          print('Pinned released v261 ZIP, manifest, all managed files and native EXE verified.')
          '@ | python -B - $download $baseline $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Released baseline source/hash validation failed' }
          python -B tools/verify_portable.py $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Released baseline portable layout invalid' }

      - name: Ordinary launch visibility and native toolbar input
        id: chrome-test
        shell: pwsh
        run: |
          python -B tools/prepare_desktop_windows.py "$env:RUNNER_TEMP/luna-ui/desktop.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop resolution was not applied' }
          python -B tools/probe_chrome_windows.py LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/ordinary"
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary launch chrome is clipped, hidden, or disconnected' }

      - name: Capture final native panel states for direct v261 screenshot comparison
        id: panel-capture
        shell: pwsh
        run: |
          python -m pip install pywinauto==0.6.9 pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Native panel capture dependency setup failed' }
          python -B tools/capture_panel_comparison_windows.py LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/panels-after" --fixed-top
          if ($LASTEXITCODE -ne 0) { throw 'Actual panel comparison capture failed' }

      - name: Same-machine PDF open benchmark against the released v261 baseline
        shell: pwsh
        run: |
          python -B tools/benchmark_open_windows.py "$env:RUNNER_TEMP/luna-performance-before" LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/performance"
          if ($LASTEXITCODE -ne 0) { throw 'Native before/after performance benchmark failed' }

      - name: Audit one checksum-pinned public ligature title before corpus evaluation
        shell: pwsh
        env:
          LUNA_METADATA_OFFLINE: '1'
          LUNA_PUBLIC_GOLDSET_AUDIT: '1'
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'luna-ui/title-audit'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          python -B -c "import json,sys; d=json.load(open('tests/goldset/public-papers.json',encoding='utf-8')); json.dump([x for x in d if x['id'] in ('PMC10025926','PMC10766651')],open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False)" "$evidence/fixture.json"
          if ($LASTEXITCODE -ne 0) { throw 'Public diagnostic manifest could not be generated' }
          python -B tools/evaluate_goldset.py --manifest "$evidence/fixture.json" --fetch "$env:RUNNER_TEMP/luna-title-audit-input" --exe LUNA-Windows-Portable/LUNA.exe --predictions "$evidence/predictions.json" --output "$evidence/score.json"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native ligature audit could not run' }
      - name: Preserve bounded public title audit immediately
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Public-Title-Audit
          path: ${{ runner.temp }}/luna-ui/title-audit
          retention-days: 90
          if-no-files-found: error

      # The original v295 independent-window probe is now obsolete: v296
      # MUST forward Explorer PDF opens to the one live tabbed GUI instead.
      # Keeping that legacy probe would reject the intended user requirement.
      - name: Native full GUI Explorer PDF opens in existing LUNA tab
        id: native-ui
        shell: pwsh
        run: |
          python -B tools/probe_shell_pdf_tabs_windows.py LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/explorer-shell"
          if ($LASTEXITCODE -ne 0) { throw 'Native LUNA second PDF did not join the existing GUI; inspect synthetic diagnostics' }

      # Only a failed native UI run triggers this Microsoft-signed debugger.
      # It cannot turn the preceding failure into a success.
      - name: Capture crash-only synthetic Windows stack (CDB)
        if: ${{ failure() && steps.native-ui.outcome == 'failure' }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'luna-ui/native-crash-replay'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          try {
            . ./tools/Luna-Crash-Tools.ps1
            $cdb = Get-LunaCdb
            python -B tools/probe_native_crash_windows.py LUNA-Windows-Portable "$evidence" --debugger "$cdb"
            if ($LASTEXITCODE -ne 0) { throw 'CDB crash replay failed; original smoke remains failed' }
          } catch {
            $_.Exception.Message | Set-Content -Encoding utf8 (Join-Path $evidence 'debugger-unavailable.txt')
            Write-Warning 'Crash replay unavailable. Original native failure is still fatal.'
          }

      - name: Production native tabs, library and fresh-process memo restoration
        id: tabs-test
        if: ${{ !inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          python -B tools/probe_tabs_integration_windows.py LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/integrated"
          if ($LASTEXITCODE -ne 0) { throw 'Production tabs/library integration failed' }

      - name: Public CC BY research PDF selection and annotation round trip
        id: research-test
        if: ${{ inputs.research_pdf_probe }}
        shell: pwsh
        run: |
          python -B tools/probe_research_windows.py LUNA-Windows-Portable --screenshots-directory "$env:RUNNER_TEMP/luna-ui/research"
          if ($LASTEXITCODE -ne 0) { throw "Public research PDF verification failed" }
          python -B tools/probe_research_windows.py LUNA-Windows-Portable --bibliography --screenshots-directory "$env:RUNNER_TEMP/luna-ui/bibliography"
          if ($LASTEXITCODE -ne 0) { throw "Real RSC bibliography verification failed" }

      - name: Restore only SHA256-pinned public bibliography inputs when verified
        uses: actions/cache/restore@v4
        with:
          path: goldset-verified-pdfs
          key: luna-goldset-${{ runner.os }}-${{ hashFiles('tests/goldset/public-papers.json') }}-v1
      - name: Evaluate checksum-pinned real public PDF bibliography corpus
        id: goldset-test
        shell: pwsh
        env:
          LUNA_METADATA_OFFLINE: '1'
        run: |
          $corpus = Join-Path $env:GITHUB_WORKSPACE 'goldset-verified-pdfs'
          $evidence = Join-Path $env:RUNNER_TEMP 'luna-ui/goldset'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          python -B tools/evaluate_goldset.py --fetch "$corpus" --exe LUNA-Windows-Portable/LUNA.exe --predictions "$evidence/predictions.json" --output "$evidence/score.json"
          if ($LASTEXITCODE -ne 0) { throw 'Actual public PDF corpus download or native evaluation failed' }
          python -B -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print(json.dumps({'exact':d['exact'],'fields':d['fields']})); p=json.load(open(sys.argv[2],encoding='utf-8')); assert not any(v.get('evaluationError') for v in p.values()); assert d['documents']==31; assert d['fields']['doi']['correct']==31; assert d['fields']['title']['correct']>=28; assert d['fields']['documentKind']['correct']>=30; assert d['fields']['authors']['correct']>=20; assert d['exact']>=15; assert all(f['wrong']==0 for f in d['fields'].values()); print('P0: 31 real PDFs, >=20 verified authors, >=15 fully exact, zero wrong automatic fields; see score.json')" "$evidence/score.json" "$evidence/predictions.json"
          if ($LASTEXITCODE -ne 0) { throw 'Goldset identified a wrong automatic DOI/title/last-author; inspect predictions before release' }

      - name: Native Windows Qt 125 and 150 percent layout checks
        shell: pwsh
        run: |
          python -B tools/smoke_windows.py LUNA-Windows-Portable --layout-only --scale 1.25 --screenshots-directory "$env:RUNNER_TEMP/luna-ui/scale125"
          if ($LASTEXITCODE -ne 0) { throw "Native Qt 125 percent layout failed" }
          python -B tools/smoke_windows.py LUNA-Windows-Portable --layout-only --scale 1.5 --screenshots-directory "$env:RUNNER_TEMP/luna-ui/scale150"
          if ($LASTEXITCODE -ne 0) { throw "Native Qt 150 percent layout failed" }

      - name: Regress legacy layout restoration and actual Ctrl+W disposal under CDB and full page heap
        if: ${{ !inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          . ./tools/Luna-Crash-Tools.ps1
          $cdb=Get-LunaCdb
          $gflags=Join-Path (Split-Path $cdb) 'gflags.exe'
          $evidence=Join-Path $env:RUNNER_TEMP 'luna-ui/legacy-layout-lifetime'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          & "$env:RUNNER_TEMP/luna-dialog-build/Release/luna-native-windowstate.exe" --export-legacy "$evidence/legacy-state.json"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic legacy layout generation failed' }
          try {
            & $gflags /p /enable LUNA.exe /full
            if ($LASTEXITCODE -ne 0) { throw 'Full page heap not enabled' }
            python -B tools/probe_editor_lifetime_windows.py LUNA-Windows-Portable "$evidence/fixed" --debugger "$cdb" --legacy-state "$evidence/legacy-state.json" --state-reader "$env:RUNNER_TEMP/luna-dialog-build/Release/luna-native-windowstate.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Legacy-layout Ctrl+W regression failed' }
          } finally { & $gflags /p /disable LUNA.exe }

      - name: Record validation scope in the portable package
        if: ${{ !inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          $pythonTests = [int](& python -B -c "import unittest; loader=unittest.TestLoader(); suite=loader.discover('tests'); assert not loader.errors, loader.errors; print(suite.countTestCases())")
          if ($LASTEXITCODE -ne 0 -or $pythonTests -lt 1) { throw 'Cannot enumerate executed Python test scope' }
          $probe = Join-Path $env:RUNNER_TEMP 'luna-dialog-build'
          $nativeScope = & ctest --test-dir $probe -C Release --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate executed native Qt test scope' }
          $nativeTests = ($nativeScope | ConvertFrom-Json).tests.Count
          if ($nativeTests -lt 1) { throw 'Empty native Qt test scope' }
          @{ product = 'LUNA Library'; status = 'development verification'; betaComplete = $false; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; qt = '6.11.3'; pdf4qt = $env:PDF4QT_PIN; vcpkg = $env:VCPKG_PIN; exeSha256 = (Get-FileHash 'LUNA-Windows-Portable/LUNA.exe' -Algorithm SHA256).Hash.ToLowerInvariant(); validation = @{ publicBibliographyGoldset = '31 checksum-pinned actual PDFs; direct PDF4QT evaluation passed; detailed field counts retained in native UI artifact'; panelOriginalHeaderY = '36px per original slot, custom widths, all states and height changes passed at 100%, 125%, 150%'; nativeMetadata = 'passed'; userPcRepeatedCtrlW = 'User confirmed 30 closes on Windows 10 at 30e2a01; current CI legacy-layout disposal regression passed under CDB/page heap'; pythonTests = $pythonTests; nativeQtTests = $nativeTests; windowsCpp = 'passed'; syntheticAnnotationRoundTrip = 'passed'; nativeTabsAndFreshProcessMemo = 'passed at 100%, 125%, 150%'; nativeTabBibliographyIsolation = 'passed at 100%, 125%, 150%'; compactFiveTabUi = 'passed: bounded tabs, left toggle, blue selection/copy, Ctrl+W and Ctrl+Q'; astraNativeProof = '40584019204 at a69be17'; singleWindowExplorerPdfTabs = 'first-window ownership, second PDF tab, duplicate activation and Unicode paths passed'; publicResearchPdf = '${{ inputs.research_pdf_probe && 'passed' || 'not run (optional)' }}'; publicMainAndSiBibliography = '${{ inputs.research_pdf_probe && 'passed' || 'not run (optional)' }}'; qtProcessDpi = '100%, 125%, 150% passed'; physicalOsMonitorDpi = 'unverified'; longSessionUse = 'unverified' } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'LUNA-Windows-Portable/build-info.json'

      - name: Verify tagged portable release manifest and file hashes (offline)
        if: ${{ !inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'luna-update-release-probe'
          python -B -m tools.prepare_release --portable LUNA-Windows-Portable --destination "$probe" --tag v0.0.0.1 --source-run $env:GITHUB_RUN_ID --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Versioned updater manifest packaging failed' }
          python -B -c "import json,zipfile,hashlib,sys,pathlib; p=pathlib.Path(sys.argv[1]); m=json.loads((p/'LUNA-Release.json').read_text()); z=zipfile.ZipFile(p/'LUNA-Windows-Portable.zip'); assert m['schema']==2 and len(m['files'])==len(z.namelist()); assert json.loads(z.read('build-info.json'))['version']=='v0.0.0.1'; assert all(hashlib.sha256(z.read(f['path'])).hexdigest()==f['sha256'] for f in m['files']); print('[PASS] Versioned updater ZIP and per-file manifest') " "$probe"
          if ($LASTEXITCODE -ne 0) { throw 'Versioned updater manifest content mismatch' }

      - name: Build and smoke-test per-user LUNA Setup EXE (optional, paused)
        id: installer-test
        if: ${{ !inputs.native_tabs_proof && inputs.build_installer }}
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (!(Test-Path $iscc)) { throw 'Pinned Inno compiler is unavailable' }
          & $iscc 'tools/LUNA-Library-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'LUNA installer compilation failed' }
          $setup = Join-Path $env:GITHUB_WORKSPACE 'LUNA-Windows-Installer/LUNA-Library-Setup.exe'
          if (!(Test-Path $setup)) { throw 'Installer output missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'luna-install-smoke'
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$destination"
          if ($LASTEXITCODE -ne 0) { throw 'Silent installer failed' }
          $installed = Join-Path $destination 'LUNA.exe'
          if (!(Test-Path $installed)) { throw 'Installed LUNA.exe missing' }
          $expected = (Get-FileHash 'LUNA-Windows-Portable/LUNA.exe' -Algorithm SHA256).Hash
          $actual = (Get-FileHash $installed -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Installer changed verified executable bytes' }
          $uninstaller = @(Get-ChildItem $destination -Filter 'unins*.exe' -File)
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing or ambiguous' }
          & $uninstaller[0].FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0 -or (Test-Path $installed)) { throw 'Silent uninstall did not remove app binaries' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
          Write-Host '[PASS] Setup EXE verified against portable, installed and uninstalled'

      - name: Upload LUNA Windows installer artifact (optional, paused)
        if: ${{ !inputs.native_tabs_proof && inputs.build_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Windows-Installer
          path: LUNA-Windows-Installer/LUNA-Library-Setup.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload synthetic native UI screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-UI-Synthetic
          path: ${{ runner.temp }}/luna-ui/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload LUNA Windows portable artifact
        if: ${{ !inputs.native_tabs_proof }}
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Windows-Portable
          path: LUNA-Windows-Portable/
          retention-days: 7
          if-no-files-found: error

      - name: Finalize Windows build diagnostic record
        if: always()
        shell: pwsh
        run: |
          if (Test-Path tools/build_diagnostics.py) {
            python -B tools/build_diagnostics.py finish --output "$env:RUNNER_TEMP/luna-build-diagnostics" --status "${{ job.status }}" --gates "checkout=${{ steps.checkout.outcome }};source=${{ steps.source-check.outcome }};chrome=${{ steps.chrome-test.outcome }};research=${{ steps.research-test.outcome }};panels=${{ steps.panel-capture.outcome }};goldset=${{ steps.goldset-test.outcome }};metadata=${{ steps.metadata-test.outcome }};dialog=${{ steps.dialog-test.outcome }};compile=${{ steps.native-compile.outcome }};portable=${{ steps.portable-check.outcome }};native-ui=${{ steps.native-ui.outcome }};tabs=${{ steps.tabs-test.outcome }};installer=${{ steps.installer-test.outcome }}" --native-evidence "$env:RUNNER_TEMP/luna-ui"
            if ($LASTEXITCODE -ne 0) { throw 'Could not finalize build diagnostics' }
          } else {
            $trace = Join-Path $env:RUNNER_TEMP 'luna-build-diagnostics'
            New-Item -ItemType Directory -Force -Path $trace | Out-Null
            @(
              '# LUNA Build Error Analysis',
              "- Run: $env:GITHUB_RUN_ID",
              "- Source SHA: $env:GITHUB_SHA",
              '- Cause not established: checkout/source diagnostics unavailable.',
              "- Job logs: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ) | Set-Content -Encoding utf8 (Join-Path $trace 'failure-analysis.md')
            Write-Warning 'Source checkout missing; bootstrap and minimal analysis preserved.'
          }
      - name: Preserve failed build analysis in a GitHub issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $analysis = Join-Path $env:RUNNER_TEMP 'luna-build-diagnostics/failure-analysis.md'
          if (Test-Path $analysis) {
            gh issue create --title "LUNA Build #$env:GITHUB_RUN_NUMBER - failure analysis" --body-file $analysis
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Could not archive failed run in GitHub Issues; artifact remains available' }
          }
      - name: Upload permanent Windows failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Build-Diagnostics
          path: ${{ runner.temp }}/luna-build-diagnostics/
          if-no-files-found: warn
          retention-days: 90

  tab-host-experiment:
    needs: windows-packaging-preflight
    if: inputs.tab_host_source_run
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a successful full Windows source build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.tab_host_source_run }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_branch -ne 'feature/windows-beta-v0.1' -or $run.path -ne '.github/workflows/build-windows.yml') { throw 'Source must be a successful Beta-branch Windows workflow' }
          python -B tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw 'Source gate failed' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          $run | Select-Object id,head_sha,html_url,conclusion | ConvertTo-Json | Set-Content evidence/source-build.json
      - uses: actions/download-artifact@v4
        with:
          name: LUNA-Windows-Portable
          run-id: ${{ inputs.tab_host_source_run }}
          github-token: ${{ github.token }}
          path: portable
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: '${{ github.workspace }}/qt/'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Compile isolated host and compare native embedding
        shell: pwsh
        run: |
          cmake -S experiments/tab_host -B tab-host-build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Host configuration failed' }
          cmake --build tab-host-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Host compile failed' }
          python -B tools/probe_tab_host_windows.py --host tab-host-build/Release/luna-tab-host.exe --package portable --output evidence
          if ($LASTEXITCODE -ne 0) { throw 'Embedding lifecycle failed; POC not accepted' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LUNA-tab-host-experimental-evidence
          path: evidence
          if-no-files-found: error
