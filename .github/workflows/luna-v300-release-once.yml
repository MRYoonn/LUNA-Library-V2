name: LUNA v300 one-time verified public release
on:
  push:
    branches: [release/v0.9.0.300-one-shot-20261109]
    paths: [.github/workflows/luna-v300-release-once.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: luna-v300-once-publish
  cancel-in-progress: false
jobs:
  publish-prepared-draft:
    if: github.repository == 'MRYoonn/LUNA-Library-V2' && github.ref_name == 'release/v0.9.0.300-one-shot-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: MRYoonn/LUNA-Library-V2
      TAG: v0.9.0.300
      RELEASE_ID: '438694016'
      SOURCE_SHA: 93a9232976c8fdf3f3bf79304c84974bf2b26fe9
      SOURCE_RUN: '42535829362'
      EXPECTED_RELEASE_ZIP: 0fc66bef8adae4a5207a0911bb21b6703ba86d247d8110ea90e7c0a1d944a43f
      EXPECTED_RELEASE_JSON: c2d0cf57bf100e06dbc33c8222688935133b2f747a740dad392ae5fd100d95a8
    steps:
      - name: Verify original CI, draft and exact release assets without modifying source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/actions/runs/42535581968" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/42535581968" --jq '.head_sha')" = "$SOURCE_SHA"
          gh api "repos/$REPO/releases/$RELEASE_ID" --jq \
            '.draft == true and .prerelease == false and .tag_name == "v0.9.0.300" and .target_commitish == "93a9232976c8fdf3f3bf79304c84974bf2b26fe9"' | grep -qx true
          gh api "repos/$REPO/releases/$RELEASE_ID" --jq \
            '.assets | (map(select(.name=="LUNA-Windows-Portable.zip" and .state=="uploaded" and .digest=="sha256:0fc66bef8adae4a5207a0911bb21b6703ba86d247d8110ea90e7c0a1d944a43f"))|length)==1 and (map(select(.name=="LUNA-Release.json" and .state=="uploaded" and .digest=="sha256:c2d0cf57bf100e06dbc33c8222688935133b2f747a740dad392ae5fd100d95a8"))|length)==1' | grep -qx true
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')" = true
      - name: Publish approved v300 after independent checks
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.draft == false and .prerelease == false' | grep -qx true
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          gh release view "$TAG" --repo "$REPO" --json url,tagName,isDraft,isPrerelease,assets
