name: LUNA v298 - real PDF filename rename and stale lock regression
on:
  push:
    branches: [feature/v298-title-rename-diagnostics-20261108]
    paths:
      - .github/workflows/v298-rename-once.yml
      - src/lunalibrary.cpp
      - tests/native_dialog/filemoves.cpp
      - tests/test_auto_filename_contract.py
      - tests/test_inline_fold_v260.py
      - tools/preflight_public.py
permissions:
  contents: read
  actions: write
jobs:
  public-source-gate:
    if: github.repository == 'MRYoonn/LUNA-Library-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the complete offline test suite
        run: |
          set -euo pipefail
          python -B tools/preflight_public.py
          python -B -m unittest discover -s tests -p 'test_*.py' -v
  native-stale-lock-and-filemove:
    needs: public-source-gate
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: 'C:/qt-luna-v298/'
          install-deps: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Exercise actual native Windows stale and live locks with paired filename moves
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $probe=Join-Path $env:RUNNER_TEMP 'luna-title-rename-probe'
          cmake -S tests/native_dialog -B $probe -G 'Visual Studio 17 2022' -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Native Qt CMake configure failed' }
          cmake --build $probe --target luna-native-filemoves --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF move probe compile failed' }
          & "$probe/Release/luna-native-filemoves.exe"
          $directCode=$LASTEXITCODE
          Write-Host "Direct native test exit code: $directCode"
          if ($directCode -ne 0) { throw "Direct PDF rename test failed: $directCode" }
          ctest --test-dir $probe -C Release -R native_file_moves -V --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows stale lock/filename regression failed' }
  dispatch-full-windows:
    needs: native-stale-lock-and-filemove
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch complete Windows portable and GUI only at passed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REPO" = MRYoonn/LUNA-Library-V2
          test "$REF_NAME" = feature/v298-title-rename-diagnostics-20261108
          test "$(gh api "repos/$REPO/branches/$REF_NAME" --jq '.commit.sha')" = "$SOURCE_SHA"
          gh api -X POST "repos/$REPO/actions/workflows/build-windows.yml/dispatches" -f ref="$REF_NAME"
          echo "Full Windows GUI and portable build dispatched after native tests passed."
