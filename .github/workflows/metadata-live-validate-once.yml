name: LUNA v295 Nature inline author - full Windows PDF4QT corpus dispatch

# Narrow one-shot trigger: full PDF4QT build remains manual-only.
on:
  push:
    branches:
      - feature/v295-nature-inline-last-author-p0-20261107
    paths:
      - .github/workflows/metadata-live-validate-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'MRYoonn/LUNA-Library-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request full Windows regression on this exact feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REPO" = 'MRYoonn/LUNA-Library-V2'
          test "$REF_NAME" = 'feature/v295-nature-inline-last-author-p0-20261107'
          test "${#SOURCE_SHA}" -eq 40
          gh api -X POST "repos/$REPO/actions/workflows/build-windows.yml/dispatches" -f ref="$REF_NAME"
          echo "LUNA v295 Nature inline author evidence: 31-public-PDF fail-closed zero-wrong gate: $SOURCE_SHA"
          echo "Inspect full preflight/Python/native Qt/PDF4QT/UI/ZIP result, never treat dispatch as PASS."
