name: LUNA v300 - automatic saved-tab title rename and linked SI validation
on:
  push:
    branches: [feature/v300-auto-rename-linked-si-20261108]
    paths:
      - .github/workflows/v300-auto-rename-si-once.yml
      - src/lunalibrary.cpp
      - tests/test_live_title_si_contract.py
      - tests/test_auto_filename_contract.py
      - tests/test_manual_si_contract.py
permissions:
  contents: read
  actions: write
concurrency:
  group: luna-v300-verified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-security:
    if: github.repository == 'MRYoonn/LUNA-Library-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Entire Python regression suite and public source security gate
        run: |
          set -euo pipefail
          python -B tools/preflight_public.py
          python -B -m unittest discover -s tests -p 'test_*.py' -v
  native-windows-si:
    needs: source-and-security
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: 'C:/qt-luna-v300/'
          install-deps: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Run physical Windows PDF/sidecar rename and manual SI Qt contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:RUNNER_TEMP 'luna-v300-native-probe'
          cmake -S tests/native_dialog -B $build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Native Qt configure failed' }
          cmake --build $build --target luna-native-filemoves luna-native-manualsi --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows native Qt compilation failed' }
          ctest --test-dir $build -C Release -R '^(native_file_moves|native_manual_si)$' -V --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'SI or PDF/sidecar native rename regression failed' }
  full-windows-build:
    needs: native-windows-si
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch complete portable GUI build on EXACT passed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = MRYoonn/LUNA-Library-V2
          test "$REF_NAME" = feature/v300-auto-rename-linked-si-20261108
          test "$(gh api "repos/$REPO/branches/$REF_NAME" --jq '.commit.sha')" = "$SOURCE_SHA"
          gh api -X POST "repos/$REPO/actions/workflows/build-windows.yml/dispatches" -f ref="$REF_NAME"
          echo "Dispatched exact source after static+native gates; full GUI build must independently succeed."
