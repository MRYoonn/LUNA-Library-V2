name: LUNA v306 native PDF font inventory one-shot verification
on:
  push:
    branches: [feature/pdf-font-inventory-v306-20261112]
    paths: [.github/workflows/pdf-font-inventory-once.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: luna-font-inventory-v306-validation
  cancel-in-progress: false
jobs:
  safe-source:
    if: github.repository == 'MRYoonn/LUNA-Library-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source privacy gate and all Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/preflight_public.py
          python -B -m unittest discover -s tests -p 'test_*.py' -q
  native-windows:
    needs: safe-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch exact-SHA full Windows native UI font inventory test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REPO" = MRYoonn/LUNA-Library-V2
          test "$BRANCH" = feature/pdf-font-inventory-v306-20261112
          test "$(gh api "repos/$REPO/branches/$BRANCH" --jq '.commit.sha')" = "$SOURCE_SHA"
          gh api -X POST "repos/$REPO/actions/workflows/build-windows.yml/dispatches" -f ref="$BRANCH"
          echo "Native Windows full build dispatched for audited source $SOURCE_SHA; no release published"
