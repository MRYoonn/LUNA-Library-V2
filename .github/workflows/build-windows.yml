name: LUNA Library V2 - PDF4QT Windows Portable

# Manual builds only. No private data, secrets, or untrusted PR execution.
on:
  workflow_dispatch:
    inputs:
      production_paper_capture:
        description: "Capture the verified f89c2a1 portable with the pinned public paper"
        type: boolean
        default: false
      ui_reference_capture:
        description: 'Capture approved v0.9.1 in Windows Edge alongside native UI evidence'
        type: boolean
        default: false
      p0_lifetime_debug:
        description: 'Diagnose unchanged b5 EXE and validate a private local crash capture kit; never a release'
        type: boolean
        default: false
      native_tabs_proof:
        description: 'Isolated native-session architecture proof; never release portable'
        type: boolean
        default: false
      tab_host_source_run:
        description: 'Experimental host only: successful full Beta Windows source run ID'
        type: string
        default: ''
      research_pdf_probe:
        description: 'Optional precise public research PDF glyph/selection check (not a core Beta gate)'
        type: boolean
        default: false
      native_probes_only:
        description: 'Run standalone native Qt probes without compiling the PDF engine'
        type: boolean
        default: false
      packaging_preflight_only:
        description: 'Validate Windows runtime staging without compiling PDF4QT'
        type: boolean
        default: false
      verify_print_portable:
        description: 'Check native Ctrl+P in the already validated reader portable build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luna-library-v2-windows-${{ inputs.ui_reference_capture && inputs.packaging_preflight_only && 'ui-reference' || inputs.p0_lifetime_debug && 'p0-lifetime' || inputs.native_probes_only && 'native-probes' || inputs.tab_host_source_run != '' && 'tab-host' || 'app' }}
  cancel-in-progress: false

jobs:
  production-paper-capture:
    if: inputs.production_paper_capture
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LUNA-Windows-Portable
          run-id: 41013214904
          github-token: ${{ github.token }}
          path: portable
      - name: Verify exact accepted EXE and capture ordinary public-paper launches
        shell: pwsh
        run: |
          $info = Get-Content portable/build-info.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash portable/LUNA.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($info.commit -ne 'f89c2a1b23aa7d4e469f00fcfd9cab8a5e119c15' -or $hash -ne 'a2da5bf18c2115c2c15a7013f426e2165226513830c553cdc83aec16ae8921bf') { throw 'Unverified portable source or executable' }
          python -B tools/prepare_desktop_windows.py captures/desktop.json
          if ($LASTEXITCODE -ne 0) { throw 'Native display mode failed' }
          python -B tools/probe_chrome_windows.py portable captures/ordinary --public-paper
          if ($LASTEXITCODE -ne 0) { throw 'Production public-paper launch failed' }
          Copy-Item portable/build-info.json captures/build-info.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: LUNA-Production-Paper-Screenshots
          path: captures/
          if-no-files-found: error

  ui-reference:
    if: inputs.ui_reference_capture
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public reference identity and capture Windows Edge
        shell: pwsh
        run: |
          python -B tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw 'Public source check failed' }
          node tools/capture_ui_reference_windows.mjs design/LUNA_Library_UI_v0.9.1_OneLineMemo.html html-reference
          if ($LASTEXITCODE -ne 0) { throw 'Windows HTML reference capture failed' }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: LUNA-HTML-v091-Windows-Reference
          path: html-reference/
          if-no-files-found: error

  p0-lifetime-debug:
    if: inputs.p0_lifetime_debug
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/p0-editor-lifetime.yml

  windows-packaging-preflight:
    if: ${{ !inputs.p0_lifetime_debug }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source gate and regression tests
        shell: pwsh
        run: |
          python -B tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw "Public security gate blocked build" }
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }
          python -B tests/native_dialog/windows_job.py
          if ($LASTEXITCODE -ne 0) { throw "Synthetic Windows process containment failed" }
      - name: Validate official x64 CRT staging on the actual Windows image
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'luna-crt-preflight'
          & ./tools/stage_msvc_runtime.ps1 -Destination $output
          python -B -c "import sys; from pathlib import Path; from tools.verify_portable import is_x64_pe; files=list(Path(sys.argv[1]).glob('*.dll')); assert files and all(is_x64_pe(p) for p in files), 'Invalid x64 CRT files'; print('[PASS] App-local CRT files are Windows x64 PE binaries')" $output
          if ($LASTEXITCODE -ne 0) { throw "CRT binary validation failed" }
      - name: Download validated reader portable for native print verification
        if: inputs.verify_print_portable
        uses: actions/download-artifact@v4
        with:
          name: LUNA-Windows-Portable
          run-id: 40282150131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/luna-verified-reader
      - name: Verify native Windows Ctrl+P and Cancel in the validated portable EXE
        if: inputs.verify_print_portable
        shell: pwsh
        run: |
          & ./tools/probe_print_windows.ps1 -Package "$env:RUNNER_TEMP/luna-verified-reader"

  native-probes:
    needs: windows-packaging-preflight
    if: inputs.native_probes_only
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Compile and run native Qt probes
        shell: pwsh
        run: |
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $probe = Join-Path $env:RUNNER_TEMP 'luna-native-probes'
          cmake -S tests/native_dialog -B $probe -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Native probe configuration failed" }
          cmake --build $probe --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native probe compilation failed" }
          ctest --test-dir $probe -C Release --verbose
          if ($LASTEXITCODE -ne 0) { throw "Native Qt probes failed" }

      - name: Compile isolated tab host without claiming POC execution
        shell: pwsh
        run: |
          $hostBuild = Join-Path $env:RUNNER_TEMP 'luna-tab-host-build'
          cmake -S experiments/tab_host -B $hostBuild -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Experimental host configuration failed" }
          cmake --build $hostBuild --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Experimental host compile failed" }
          Write-Host '[NOTICE] Host compilation only; no PDF embedding or POC acceptance is implied.'

  build-windows:
    needs: windows-packaging-preflight
    permissions:
      contents: read
      actions: read
    if: ${{ !inputs.production_paper_capture && !inputs.packaging_preflight_only && !inputs.native_probes_only && !inputs.tab_host_source_run }}
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PDF4QT_PIN: 67b6b9903cb4e318803342f2d428f02e1bb124e3
      # Same public vcpkg revision used by the preserved successful Build 20.
      VCPKG_PIN: 817892b0ecbc6af994dd6df999c73faf795adbf2
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\pdf4qt\vcpkg\overlays\general
    steps:
      - name: Checkout public builder with no retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail-closed public security checks
        shell: pwsh
        run: |
          python tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw "Public security gate blocked build" }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }

      - name: Download and verify pinned public PDF4QT
        shell: pwsh
        run: |
          git init pdf4qt
          git -C pdf4qt remote add origin https://github.com/JakubMelka/PDF4QT.git
          git -C pdf4qt fetch --depth 1 origin $env:PDF4QT_PIN
          if ($LASTEXITCODE -ne 0) { throw "Upstream checkout failed" }
          git -C pdf4qt checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Upstream checkout failed" }
          $actual = (git -C pdf4qt rev-parse HEAD).Trim()
          if ($actual -ne $env:PDF4QT_PIN) { throw "Upstream SHA mismatch" }

      - name: Stabilize pinned engine source timestamps for incremental compilation
        shell: pwsh
        run: |
          # Only immutable upstream files; overlay sources are written afterward
          # with fresh timestamps and are rebuilt on every application change.
          $env:LUNA_ENGINE_TIMESTAMP = (git -C pdf4qt show -s --format=%ct HEAD).Trim()
          python -B -c "import os; from pathlib import Path; stamp=int(os.environ['LUNA_ENGINE_TIMESTAMP']); root=Path('pdf4qt'); files=[p for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts]; [os.utime(p,(stamp,stamp)) for p in files]"
          if ($LASTEXITCODE -ne 0) { throw 'Engine source timestamp normalization failed' }

      - name: Apply isolated LUNA target
        shell: pwsh
        run: |
          python tools/apply_overlay.py pdf4qt --dry-run
          if ($LASTEXITCODE -ne 0) { throw "Source pin mismatch" }
          python tools/apply_overlay.py pdf4qt
          if ($LASTEXITCODE -ne 0) { throw "LUNA patch failed" }

      - name: Apply opt-in native session proof
        shell: pwsh
        run: |
          $proofArguments = @()
          if ('${{ inputs.native_tabs_proof }}' -ne 'true') { $proofArguments += '--backend-only' }
          python -B experiments/native_tabs/prepare.py pdf4qt @proofArguments
          if ($LASTEXITCODE -ne 0) { throw "Native session source gate failed" }
          python -B tools/apply_performance.py pdf4qt
          if ($LASTEXITCODE -ne 0) { throw "Performance instrumentation failed" }

      - name: Identify the Windows compiler image for dependency caching
        id: compiler-image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = (Get-Content (Join-Path $installation 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          if (-not $toolset) { throw 'Could not identify MSVC version' }
          "identity=$($env:ImageVersion)-$toolset" >> $env:GITHUB_OUTPUT

      # Public dependency cache only; contains no user documents or authentication data.
      - name: Cache public vcpkg archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg-binary-cache
            vcpkg/downloads
          key: ${{ runner.os }}-pdf4qt-vcpkg-${{ env.VCPKG_PIN }}-${{ steps.compiler-image.outputs.identity }}-${{ hashFiles('pdf4qt/vcpkg.json', 'pdf4qt/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-pdf4qt-vcpkg-${{ env.VCPKG_PIN }}-${{ steps.compiler-image.outputs.identity }}-
            ${{ runner.os }}-pdf4qt-vcpkg-${{ hashFiles('pdf4qt/vcpkg.json', 'pdf4qt/vcpkg-configuration.json') }}

      # LUNA first-use beta excludes OCR. Skip unnecessary Windows packages.
      # This changes only the ephemeral public PDF4QT checkout, never the pinned source.
      - name: Exclude optional OCR and Linux-only TBB from Windows dependencies
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'pdf4qt/vcpkg.json'
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.dependencies = @($manifest.dependencies | Where-Object { $_ -notin @('tesseract', 'tbb') })
          $manifest | ConvertTo-Json -Depth 15 | Set-Content -Encoding utf8 $manifestPath
          Write-Host "Release-only dependencies:" ($manifest.dependencies -join ', ')

      - name: Prepare vcpkg packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # Cache restore may already have created vcpkg/downloads. Preserve it.
          git init vcpkg
          if ($LASTEXITCODE -ne 0) { throw "vcpkg init failed" }
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE -ne 0) { throw "vcpkg remote setup failed" }
          git -C vcpkg fetch --depth 1 origin $env:VCPKG_PIN
          if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch failed" }
          git -C vcpkg checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed" }
          if ((git -C vcpkg rev-parse HEAD).Trim() -ne $env:VCPKG_PIN) { throw "vcpkg revision mismatch" }
          $baseline = (Get-Content -Raw pdf4qt/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C vcpkg fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "vcpkg baseline missing" }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE\pdf4qt" --x-install-root="$env:VCPKG_INSTALLED_DIR" --clean-buildtrees-after-build --clean-packages-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependencies failed" }

      # Preserve successfully built public dependencies even if a later native
      # regression fails. The app, user files and settings are never cached.
      - name: Save validated public dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg-binary-cache
            vcpkg/downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Test LUNA metadata Qt native contracts (no network)
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'luna-metadata-build'
          cmake -S tests/native_metadata -B $probe -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Metadata Qt test CMake configuration failed" }
          cmake --build $probe --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Metadata Qt native compilation failed" }
          ctest --test-dir $probe -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Metadata Qt native contract test failed" }

      - name: Test native Save As dialog before compiling the PDF engine
        shell: pwsh
        run: |
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $probe = Join-Path $env:RUNNER_TEMP 'luna-dialog-build'
          cmake -S tests/native_dialog -B $probe -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Native dialog probe configuration failed" }
          cmake --build $probe --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native dialog probe compile failed" }
          ctest --test-dir $probe -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native dialog probe failed; PDF engine build not started" }

      - name: Restore public engine compilation cache
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: pdf4qt/build
          key: ${{ runner.os }}-luna-native-sessions-release-noocr-v2-${{ env.PDF4QT_PIN }}-${{ env.VCPKG_PIN }}-qt6.11.3-${{ steps.compiler-image.outputs.identity }}

      - name: Configure native Windows build
        shell: pwsh
        run: |
          cmake -S pdf4qt -B pdf4qt/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DPDF4QT_QT_ROOT="$env:QT_ROOT_DIR" -DPDF4QT_BUILD_TESTS=OFF -DPDF4QT_ENABLE_OCR=OFF -DPDF4QT_INSTALL_DEPENDENCIES=ON -DPDF4QT_INSTALL_QT_DEPENDENCIES=ON -DPDF4QT_INSTALL_MSVC_REDISTRIBUTABLE=ON -DPDF4QT_INSTALL_PREPARE_WIX_INSTALLER=OFF -DPDF4QT_INSTALL_TO_USR=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

      - name: Compile source and install DLLs
        shell: pwsh
        run: |
          cmake --build pdf4qt/build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native compile failed" }
          cmake --install pdf4qt/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Native install failed" }

      # Cache before any PDF is opened: public compiler outputs only. Every
      # restored build still configures, compiles and runs the complete gates.
      - name: Save public engine compilation cache
        if: ${{ !inputs.native_tabs_proof && steps.engine-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: pdf4qt/build
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

      - name: Create standalone portable LUNA
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'pdf4qt/build/install/usr/bin'
          if (!(Test-Path "$bin/LUNA.exe")) { throw "LUNA.exe absent" }
          $output = Join-Path $env:GITHUB_WORKSPACE 'LUNA-Windows-Portable'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item -Path "$bin/*" -Destination $output -Recurse -Force
          Get-ChildItem -LiteralPath $output -Filter '*.exe' -File | Where-Object { $_.Name -ne 'LUNA.exe' } | Remove-Item
          Copy-Item 'pdf4qt/LICENSE' "$output/PDF4QT_LICENSE.txt"
          Copy-Item 'pdf4qt/3rdparty_licenses' "$output/third_party_licenses" -Recurse
          Copy-Item 'LICENSE_NOTICE.md' "$output/LUNA_LICENSE_NOTICE.md"
          Copy-Item 'USER_GUIDE_KO.md' "$output/USER_GUIDE_KO.md"
          Copy-Item 'tools/LUNA-Update.ps1' "$output/LUNA-Update.ps1"
          $updateTokens = $null; $updateErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $output 'LUNA-Update.ps1'), [ref]$updateTokens, [ref]$updateErrors) | Out-Null
          if ($updateErrors.Count) { throw 'Updater PowerShell syntax failed' }
          Copy-Item 'tools/Start-Luna-Diagnostics.*' $output
          Copy-Item 'tools/*Crash*.ps1','tools/*Crash*.cmd','CRASH_DIAGNOSTICS_KO.md' $output
          $diagnosticTokens = $null; $diagnosticErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $output 'Start-Luna-Diagnostics.ps1'), [ref]$diagnosticTokens, [ref]$diagnosticErrors) | Out-Null
          if ($diagnosticErrors.Count) { throw 'Diagnostic launcher PowerShell syntax failed' }
          @{ product = 'LUNA Library'; status = 'development verification'; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; qt = '6.11.3'; pdf4qt = $env:PDF4QT_PIN; vcpkg = $env:VCPKG_PIN; validation = 'pending' } | ConvertTo-Json | Set-Content -Encoding utf8 "$output/build-info.json"
          # App-local redistributable DLLs make this portable on a clean PC.
          # windeployqt's release --compiler-runtime bundles a separate installer,
          # and cannot locate Visual Studio at all without VCINSTALLDIR.
          & ./tools/stage_msvc_runtime.ps1 -Destination $output
          $windeployqt = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          if (!(Test-Path $windeployqt)) { throw "Qt deploy tool absent" }
          & $windeployqt --release --no-compiler-runtime "$output/LUNA.exe"
          if ($LASTEXITCODE -ne 0) { throw "Qt DLL deployment failed" }
          if (!(Test-Path "$output/Qt6Core.dll")) { throw "Qt DLL missing" }
          $private = @(Get-ChildItem -Path $output -File -Recurse | Where-Object { $_.Extension -in @('.pdf','.db','.sqlite','.sqlite3','.env','.log','.pem','.pfx') })
          if ($private.Count -gt 0) { throw "Sensitive artifact blocked" }
          Get-FileHash "$output/LUNA.exe" -Algorithm SHA256 | Format-List

      - name: Execute native two-document session acceptance
        if: ${{ inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem pdf4qt/build -Recurse -Filter LunaNativeTabs.exe -File)
          if ($exe.Count -ne 1) { throw 'Expected one native proof executable' }
          $proof = Join-Path $env:RUNNER_TEMP 'luna-native-proof-package'
          Copy-Item LUNA-Windows-Portable $proof -Recurse
          Copy-Item $exe[0].FullName (Join-Path $proof 'LunaNativeTabs.exe')
          python -B experiments/native_tabs/run_windows.py "$proof/LunaNativeTabs.exe" "$env:RUNNER_TEMP/luna-native-tabs-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime acceptance failed; compilation is not success' }

      - name: Upload native session evidence even on failure
        if: ${{ always() && inputs.native_tabs_proof }}
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-native-tabs-evidence
          path: ${{ runner.temp }}/luna-native-tabs-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify portable package layout
        shell: pwsh
        run: |
          python -B tools/verify_portable.py LUNA-Windows-Portable
          if ($LASTEXITCODE -ne 0) { throw "Portable package verification failed" }

      - name: Download the measured pre-fix baseline for same-machine comparison
        uses: actions/download-artifact@v4
        with:
          name: LUNA-Windows-Portable
          run-id: 40984112766
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/luna-performance-before

      - name: Ordinary launch visibility and native toolbar input
        shell: pwsh
        run: |
          python -B tools/prepare_desktop_windows.py "$env:RUNNER_TEMP/luna-ui/desktop.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop resolution was not applied' }
          python -B tools/probe_chrome_windows.py LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/ordinary"
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary launch chrome is clipped, hidden, or disconnected' }

      - name: Same-machine PDF open benchmark against the pre-fix baseline
        shell: pwsh
        run: |
          python -B tools/benchmark_open_windows.py "$env:RUNNER_TEMP/luna-performance-before" LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/performance"
          if ($LASTEXITCODE -ne 0) { throw 'Native before/after performance benchmark failed' }

      - name: Independent document windows and native annotation round trip
        shell: pwsh
        run: |
          python -B tools/probe_documents_windows.py LUNA-Windows-Portable --screenshots-directory "$env:RUNNER_TEMP/luna-ui"
          if ($LASTEXITCODE -ne 0) { throw "Native UI or annotation round trip failed" }

      - name: Production native tabs, library and fresh-process memo restoration
        if: ${{ !inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          python -B tools/probe_tabs_integration_windows.py LUNA-Windows-Portable "$env:RUNNER_TEMP/luna-ui/integrated"
          if ($LASTEXITCODE -ne 0) { throw 'Production tabs/library integration failed' }

      - name: Public CC BY research PDF selection and annotation round trip
        if: ${{ inputs.research_pdf_probe }}
        shell: pwsh
        run: |
          python -B tools/probe_research_windows.py LUNA-Windows-Portable --screenshots-directory "$env:RUNNER_TEMP/luna-ui/research"
          if ($LASTEXITCODE -ne 0) { throw "Public research PDF verification failed" }
          python -B tools/probe_research_windows.py LUNA-Windows-Portable --bibliography --screenshots-directory "$env:RUNNER_TEMP/luna-ui/bibliography"
          if ($LASTEXITCODE -ne 0) { throw "Real RSC bibliography verification failed" }

      - name: Native Windows Qt 125 and 150 percent layout checks
        shell: pwsh
        run: |
          python -B tools/smoke_windows.py LUNA-Windows-Portable --layout-only --scale 1.25 --screenshots-directory "$env:RUNNER_TEMP/luna-ui/scale125"
          if ($LASTEXITCODE -ne 0) { throw "Native Qt 125 percent layout failed" }
          python -B tools/smoke_windows.py LUNA-Windows-Portable --layout-only --scale 1.5 --screenshots-directory "$env:RUNNER_TEMP/luna-ui/scale150"
          if ($LASTEXITCODE -ne 0) { throw "Native Qt 150 percent layout failed" }

      - name: Regress legacy layout restoration and actual Ctrl+W disposal under CDB and full page heap
        if: ${{ !inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          . ./tools/Luna-Crash-Tools.ps1
          $cdb=Get-LunaCdb
          $gflags=Join-Path (Split-Path $cdb) 'gflags.exe'
          $evidence=Join-Path $env:RUNNER_TEMP 'luna-ui/legacy-layout-lifetime'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          & "$env:RUNNER_TEMP/luna-dialog-build/Release/luna-native-windowstate.exe" --export-legacy "$evidence/legacy-state.json"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic legacy layout generation failed' }
          try {
            & $gflags /p /enable LUNA.exe /full
            if ($LASTEXITCODE -ne 0) { throw 'Full page heap not enabled' }
            python -B tools/probe_editor_lifetime_windows.py LUNA-Windows-Portable "$evidence/fixed" --debugger "$cdb" --legacy-state "$evidence/legacy-state.json" --state-reader "$env:RUNNER_TEMP/luna-dialog-build/Release/luna-native-windowstate.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Legacy-layout Ctrl+W regression failed' }
          } finally { & $gflags /p /disable LUNA.exe }

      - name: Record validation scope in the portable package
        if: ${{ !inputs.native_tabs_proof }}
        shell: pwsh
        run: |
          $pythonTests = [int](& python -B -c "import unittest; loader=unittest.TestLoader(); suite=loader.discover('tests'); assert not loader.errors, loader.errors; print(suite.countTestCases())")
          if ($LASTEXITCODE -ne 0 -or $pythonTests -lt 1) { throw 'Cannot enumerate executed Python test scope' }
          $probe = Join-Path $env:RUNNER_TEMP 'luna-dialog-build'
          $nativeScope = & ctest --test-dir $probe -C Release --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate executed native Qt test scope' }
          $nativeTests = ($nativeScope | ConvertFrom-Json).tests.Count
          if ($nativeTests -lt 1) { throw 'Empty native Qt test scope' }
          @{ product = 'LUNA Library'; status = 'development verification'; betaComplete = $false; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; qt = '6.11.3'; pdf4qt = $env:PDF4QT_PIN; vcpkg = $env:VCPKG_PIN; exeSha256 = (Get-FileHash 'LUNA-Windows-Portable/LUNA.exe' -Algorithm SHA256).Hash.ToLowerInvariant(); validation = @{ userPcRepeatedCtrlW = 'User confirmed 30 closes on Windows 10 at 30e2a01; current CI legacy-layout disposal regression passed under CDB/page heap'; pythonTests = $pythonTests; nativeQtTests = $nativeTests; windowsCpp = 'passed'; syntheticAnnotationRoundTrip = 'passed'; nativeTabsAndFreshProcessMemo = 'passed at 100%, 125%, 150%'; nativeTabBibliographyIsolation = 'passed at 100%, 125%, 150%'; compactFiveTabUi = 'passed: bounded tabs, left toggle, blue selection/copy, Ctrl+W and Ctrl+Q'; astraNativeProof = '40584019204 at a69be17'; independentDocumentWindows = '2, 5, 10 passed'; publicResearchPdf = '${{ inputs.research_pdf_probe && 'passed' || 'not run (optional)' }}'; publicMainAndSiBibliography = '${{ inputs.research_pdf_probe && 'passed' || 'not run (optional)' }}'; qtProcessDpi = '100%, 125%, 150% passed'; physicalOsMonitorDpi = 'unverified'; longSessionUse = 'unverified' } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'LUNA-Windows-Portable/build-info.json'

      - name: Upload synthetic native UI screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-UI-Synthetic
          path: ${{ runner.temp }}/luna-ui/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload LUNA Windows portable artifact
        if: ${{ !inputs.native_tabs_proof }}
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Windows-Portable
          path: LUNA-Windows-Portable/
          retention-days: 7
          if-no-files-found: error

  tab-host-experiment:
    needs: windows-packaging-preflight
    if: inputs.tab_host_source_run
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a successful full Windows source build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.tab_host_source_run }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_branch -ne 'feature/windows-beta-v0.1' -or $run.path -ne '.github/workflows/build-windows.yml') { throw 'Source must be a successful Beta-branch Windows workflow' }
          python -B tools/preflight_public.py
          if ($LASTEXITCODE -ne 0) { throw 'Source gate failed' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          $run | Select-Object id,head_sha,html_url,conclusion | ConvertTo-Json | Set-Content evidence/source-build.json
      - uses: actions/download-artifact@v4
        with:
          name: LUNA-Windows-Portable
          run-id: ${{ inputs.tab_host_source_run }}
          github-token: ${{ github.token }}
          path: portable
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: '${{ github.workspace }}/qt/'
          cache: 'false'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Compile isolated host and compare native embedding
        shell: pwsh
        run: |
          cmake -S experiments/tab_host -B tab-host-build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Host configuration failed' }
          cmake --build tab-host-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Host compile failed' }
          python -B tools/probe_tab_host_windows.py --host tab-host-build/Release/luna-tab-host.exe --package portable --output evidence
          if ($LASTEXITCODE -ne 0) { throw 'Embedding lifecycle failed; POC not accepted' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LUNA-tab-host-experimental-evidence
          path: evidence
          if-no-files-found: error
