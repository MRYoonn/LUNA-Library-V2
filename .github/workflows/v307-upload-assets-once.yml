name: Upload verified Windows assets to the v307 draft
on:
  push:
    branches: [release/v0.9.0.307-assets]
    paths: [.github/workflows/v307-upload-assets-once.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: luna-v307-release-assets-once
  cancel-in-progress: false
jobs:
  assets:
    if: github.repository == 'MRYoonn/LUNA-Library-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: '63c564f6e6a6a7e9837f58fd4cdf59c542a59641'
      BUILD_RUN: '44996922930'
      DRAFT_ID: '454295805'
      TAG: 'v0.9.0.307'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact passing build and unpublished destination
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = release/v0.9.0.307-assets
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/v307-upload-assets-once.yml
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.head_sha + ":" + .conclusion + ":" + .path')" = "$SOURCE_SHA:success:.github/workflows/build-windows.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --jq '[.tag_name,.target_commitish,.draft,.prerelease,(.assets | length)]|join(":")')" = "$TAG:$SOURCE_SHA:true:false:0"
      - name: Assemble and verify the Windows package from its exact CI artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name LUNA-Windows-Portable --dir portable
          python -B -m tools.prepare_release --portable portable --destination dist --tag "$TAG" --source-run "$BUILD_RUN" --commit "$SOURCE_SHA"
          cd dist
          sha256sum LUNA-Windows-Portable.zip LUNA-Release.json > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          manifest = json.loads(Path('LUNA-Release.json').read_text())
          with zipfile.ZipFile('LUNA-Windows-Portable.zip') as archive:
              assert archive.testzip() is None
              assert sorted(archive.namelist()) == sorted(item['path'] for item in manifest['files'])
              for item in manifest['files']:
                  data = archive.read(item['path'])
                  assert len(data) == item['size']
                  assert hashlib.sha256(data).hexdigest() == item['sha256']
          PY
      - name: Attach exactly three verified assets to the draft
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/LUNA-Windows-Portable.zip dist/LUNA-Release.json dist/SHA256SUMS.txt
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --jq '[.assets[].name]|sort|join(",")')" = LUNA-Release.json,LUNA-Windows-Portable.zip,SHA256SUMS.txt
