name: LUNA v301 one-time verified stable release
on:
  push:
    branches: [release/v0.9.0.301-one-shot-20261110]
    paths: [.github/workflows/luna-v301-release-once.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: luna-v301-single-publish
  cancel-in-progress: false
jobs:
  publish-verified-v301:
    if: github.repository == 'MRYoonn/LUNA-Library-V2' && github.ref_name == 'release/v0.9.0.301-one-shot-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: MRYoonn/LUNA-Library-V2
      TAG: v0.9.0.301
      SOURCE_SHA: 6ae179cfb261aacee9f13e6ea6c8040068d796e2
      SOURCE_RUN: '42745093283'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight exact source, full native Windows run, PR and stable predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          test "$GITHUB_REF_NAME" = release/v0.9.0.301-one-shot-20261110
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_branch')" = fix/notability-vector-grid-20261110
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.path')" = .github/workflows/build-windows.yml
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name=="build-windows" and .conclusion=="success")] | length')" = 1
          test "$(gh api "repos/$REPO/pulls/104" --jq '.merged')" = true
          test "$(gh api "repos/$REPO/pulls/104" --jq '.head.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')" = v0.9.0.300
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo 'v301 release already exists'; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo 'v301 tag already exists'; exit 1; fi
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -B tools/preflight_public.py
          python -B -m unittest discover -s tests -p 'test_*.py' -q
      - name: Download the exact Windows Portable artifact and produce verified release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/portable
          gh run download "$SOURCE_RUN" --repo "$REPO" --name LUNA-Windows-Portable --dir staging/portable
          python -B -m tools.prepare_release --portable staging/portable --destination dist --tag "$TAG" --source-run "$SOURCE_RUN" --commit "$SOURCE_SHA"
          python -c "import json,hashlib,pathlib; m=json.loads(pathlib.Path('dist/LUNA-Release.json').read_text()); h=hashlib.sha256(pathlib.Path('dist/LUNA-Windows-Portable.zip').read_bytes()).hexdigest(); assert m['tag']=='v0.9.0.301' and m['source_run']==42745093283 and m['commit']=='6ae179cfb261aacee9f13e6ea6c8040068d796e2' and m['sha256']==h; print('ZIP and manifest source SHA256 validated')"
      - name: Create sealed draft, verify exact GitHub asset digests, then publish stable
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/LUNA-Windows-Portable.zip dist/LUNA-Release.json --repo "$REPO" --target "$SOURCE_SHA" --draft --title 'LUNA Library v0.9.0.301 — PDF vector grid-line visibility' --notes 'Stable Windows Portable update from verified Windows GUI build 42745093283. Fixes thin PDF vector/table line visibility in the LUNA reader at small zoom, preserving the original PDF, print path, text selection, and annotations. Also retains the verified 150% DPI legacy-layout Ctrl+W lifetime checks. Original user research-note display has not been visually verified on their PC. Automatic updater: SHA256 manifest included.'
          ZIP_SHA=$(sha256sum dist/LUNA-Windows-Portable.zip | cut -d' ' -f1)
          JSON_SHA=$(sha256sum dist/LUNA-Release.json | cut -d' ' -f1)
          RELEASE_ID=$(gh api "repos/$REPO/releases?per_page=100" | jq -er --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.[] | select(.tag_name==$tag and .target_commitish==$sha and .draft==true) | .id')
          test -n "$RELEASE_ID"
          gh api "repos/$REPO/releases/$RELEASE_ID" | jq -e --arg zip "sha256:$ZIP_SHA" --arg manifest "sha256:$JSON_SHA" '
            (.draft == true) and (.prerelease == false) and
            (([.assets[] | select(.name=="LUNA-Windows-Portable.zip" and .state=="uploaded" and .digest==$zip)] | length) == 1) and
            (([.assets[] | select(.name=="LUNA-Release.json" and .state=="uploaded" and .digest==$manifest)] | length) == 1)'
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.draft == false and .prerelease == false' | grep -qx true
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')" = "$TAG"
          gh release view "$TAG" --repo "$REPO" --json url,tagName,isDraft,isPrerelease,assets
          echo "Published validated $TAG source=$SOURCE_SHA run=$SOURCE_RUN zip=$ZIP_SHA manifest=$JSON_SHA"
