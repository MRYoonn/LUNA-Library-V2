name: LUNA - publish verified first stable update feed (one-shot)

# User-authorized publication. Isolated release branch, exact validated draft
# ID and asset SHA256s. Does not rebuild, replace assets, or modify user PDFs.
on:
  push:
    branches:
      - agent/luna-first-release-20261103
    paths:
      - .github/workflows/luna-first-publish-once.yml

permissions:
  contents: write
  actions: read

jobs:
  validate-and-publish:
    if: github.repository == 'MRYoonn/LUNA-Library-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_ID: '432310440'
      SOURCE_RUN: '41577602717'
      SOURCE_SHA: '0550c5a2b57e4704c6e1a255a3abfe0094880dbe'
      VERSION_TAG: 'v0.9.0.243'
    steps:
      - name: Verify existing draft, immutable asset digests, Windows source CI
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = 'MRYoonn/LUNA-Library-V2'
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_branch')" = manager8/folder-count-verifier-20261103
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.path')" = .github/workflows/build-windows.yml
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" |
            jq -e '([.jobs[] | select(.name == "windows-packaging-preflight" or .name == "build-windows") | .conclusion] | sort) == ["success","success"]' >/dev/null
          gh api "repos/$REPO/releases/$RELEASE_ID" | jq -e \
            --arg tag "$VERSION_TAG" --arg sha "$SOURCE_SHA" '
            .draft == true and .prerelease == false and
            .tag_name == $tag and .target_commitish == $sha and
            ([.assets[] | {name, size, digest}] | sort_by(.name)) == [
              {"name":"LUNA-Release.json","size":21693,
               "digest":"sha256:87eb18220ab89ca1f1f0716b769c19bb403c8608a30715140bbc75f1f4997e2a"},
              {"name":"LUNA-Windows-Portable.zip","size":51762009,
               "digest":"sha256:d145ac054f985633b1ddc09bc8b0418545079d3af629649dfef384dfc9cee646"} ]' >/dev/null
          echo "PASS: exact Build #243, successful CI, intended draft and two intact release assets"
      - name: Publish the ALREADY-VERIFIED draft (no rebuild, no asset mutation)
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true \
            --jq '{id,tag_name,draft,prerelease,target_commitish,html_url}'
          gh api "repos/$REPO/releases/$RELEASE_ID" | jq -e \
            --arg tag "$VERSION_TAG" --arg sha "$SOURCE_SHA" '
            .draft == false and .prerelease == false and
            .tag_name == $tag and .target_commitish == $sha and
            ([.assets[].name] | sort) == ["LUNA-Release.json","LUNA-Windows-Portable.zip"]' >/dev/null
          for attempt in 1 2 3 4 5 6; do
            if [ "$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)" = "$VERSION_TAG" ]; then
              echo 'PASS: latest public stable release feed now reports v0.9.0.243'
              exit 0
            fi
            sleep 2
          done
          echo "Release published but latest feed not yet confirmed; inspect public release API" >&2
          exit 1
