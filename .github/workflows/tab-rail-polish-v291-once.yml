name: LUNA v0.9.0.291 compact PDF tabs and original-slot rail polish - verified Windows release
on:
  push:
    branches:
      - feature/tab-rail-polish-v291-20261107
    paths:
      - .github/workflows/tab-rail-polish-v291-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: luna-v291-verified-release-once
  cancel-in-progress: false

jobs:
  public-source-gate:
    if: github.repository == 'MRYoonn/LUNA-Library-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate privacy allowlist and all Python/source regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/preflight_public.py
          python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Record source failure-analysis evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf 'v291 source gate exact commit=%s, run=%s. Inspect first failed step, never bypass checks.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > evidence/failure-analysis.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LUNA-v291-Source-Diagnostics
          path: evidence/failure-analysis.md
          retention-days: 90

  windows-validate-and-release:
    needs: public-source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
      TAG: v0.9.0.291
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authorize single source SHA, prevent tag collision, launch full native build
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = MRYoonn/LUNA-Library-V2
          test "$BRANCH" = feature/tab-rail-polish-v291-20261107
          test "$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = v0.9.0.290
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'v291 already exists, refusing overwrite'; exit 1
          fi
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
          gh api -X POST "repos/$REPO/actions/workflows/build-windows.yml/dispatches" -f ref="$BRANCH"
          echo "GitHub Windows build requested for $SOURCE_SHA"
      - name: Require completed successful same-SHA full PDF4QT Windows build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          run=''
          for attempt in $(seq 1 200); do
            if [[ -z "$run" ]]; then
              run="$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=40" | jq -r --arg sha "$SOURCE_SHA" '
                 [.workflow_runs[] | select(.head_sha==$sha and .path==".github/workflows/build-windows.yml")] |
                 sort_by(.created_at) | last | .id // empty')"
            fi
            if [[ -n "$run" ]]; then
              gh api "repos/$REPO/actions/runs/$run" > evidence/windows-run.json
              status="$(jq -r .status evidence/windows-run.json)"
              result="$(jq -r '.conclusion // empty' evidence/windows-run.json)"
              printf 'native build id=%s status=%s conclusion=%s attempt=%s\n' "$run" "$status" "$result" "$attempt"
              if [[ "$status" == completed ]]; then
                test "$result" = success || { echo "Full Windows build did not pass: $result" >&2; exit 1; }
                test "$(jq -r .head_sha evidence/windows-run.json)" = "$SOURCE_SHA"
                test "$(jq -r .path evidence/windows-run.json)" = .github/workflows/build-windows.yml
                test "$(jq -r .head_branch evidence/windows-run.json)" = "$BRANCH"
                echo "$run" > evidence/source-run.txt
                exit 0
              fi
            fi
            sleep 30
          done
          echo "Full Windows build never returned successful completion" >&2
          exit 1
      - name: Retrieve verified Windows Portable and repeat deterministic release provenance checks
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN="$(cat evidence/source-run.txt)"
          mkdir -p staging/portable dist
          gh run download "$SOURCE_RUN" --repo "$REPO" --name LUNA-Windows-Portable --dir staging/portable
          python -B -m tools.prepare_release --portable staging/portable --destination dist --tag "$TAG" --source-run "$SOURCE_RUN" --commit "$SOURCE_SHA" > evidence/release-info.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          m=json.loads(Path('dist/LUNA-Release.json').read_text())
          p=Path('dist/LUNA-Windows-Portable.zip')
          info=json.loads(Path('staging/portable/build-info.json').read_text(encoding='utf-8-sig'))
          assert m['tag']=='v0.9.0.291' and m['schema']==2
          assert m['commit']==info['commit'] and int(info['run'])==m['source_run']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(m['files'])
              assert set(z.namelist())==set(f['path'] for f in m['files'])
              for f in m['files']:
                  b=z.read(f['path'])
                  assert len(b)==f['size'] and hashlib.sha256(b).hexdigest()==f['sha256'],f['path']
              tagged=json.loads(z.read('build-info.json'))
              assert tagged['commit']==m['commit'] and tagged['version']==m['tag']
              assert int(tagged['run'])==m['source_run']
              assert hashlib.sha256(z.read('LUNA.exe')).hexdigest()==info['exeSha256']
          print('v291: audited manifest, all file sha256, zip, unchanged Windows EXE')
          PY
      - name: Create immutable draft release; verify server-side SHA256 digests before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)" = "$SOURCE_SHA"
          gh release create "$TAG" dist/LUNA-Windows-Portable.zip dist/LUNA-Release.json \
            --repo "$REPO" --target "$SOURCE_SHA" --draft --title "LUNA Library v0.9.0.291 — Compact tab and folded panel polish" \
            --notes "Windows Portable, exact-source native PDF4QT/MSVC and full UI regression. v291 UI refinement: both original-slot 36px restore rails have horizontally centered buttons, retain previous vertical header anchors and panel contrast; PDF tabs use a 192px preferred width instead of 218px, and the disabled empty-tab X remains visibly differentiated without becoming clickable. Preserves v290 bibliography 31-paper evaluation, manual metadata protections, user PDFs, SI links, and all previous controls. Personal-PC use and two-machine MYBOX sync are not separately verified."
          id="$(gh api "repos/$REPO/releases?per_page=30" | jq -r --arg tag "$TAG" '
                 [.[] | select(.tag_name==$tag and .draft==true)] | first | .id // empty')"
          test "$id" != ''
          gh api "repos/$REPO/releases/$id" > evidence/draft-release.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('evidence/draft-release.json').read_text())
          m=json.loads(Path('dist/LUNA-Release.json').read_text())
          assert r['draft'] is True and r['prerelease'] is False and r['tag_name']==m['tag']
          assert r['target_commitish']==m['commit'] and len(r['assets'])==2
          expected={
              'LUNA-Windows-Portable.zip':('sha256:'+m['sha256'],len(Path('dist/LUNA-Windows-Portable.zip').read_bytes())),
              'LUNA-Release.json':('sha256:'+hashlib.sha256(Path('dist/LUNA-Release.json').read_bytes()).hexdigest(),len(Path('dist/LUNA-Release.json').read_bytes()))
          }
          assert {a['name']:(a['digest'],a['size']) for a in r['assets']}==expected
          print('GitHub uploaded release assets independently match local ZIP/manifest digests')
          PY
          echo "$id" > evidence/draft-id.txt
      - name: Publish v291 and verify updater-visible latest tag plus immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          id="$(cat evidence/draft-id.txt)"
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -F prerelease=false --jq '.tag_name,.draft,.published_at'
          test "$(gh api "repos/$REPO/releases/$id" --jq .draft)" = false
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          echo "SUCCESS https://github.com/$REPO/releases/tag/$TAG"
      - name: Preserve failure analysis, immutable provenance and CI summary
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf 'v291 exact source=%s, orchestration run=%s. Any failed gate prevents release publication. Historical Build #250 failed manual dock-width persistence, now checked by 10-cycle native test.\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > evidence/failure-analysis.md
          test ! -f dist/LUNA-Release.json || cp dist/LUNA-Release.json evidence/release-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LUNA-v291-Release-Diagnostics
          path: evidence/
          retention-days: 90
